          {% set room_was_writing_comfort = (current_setpoint | float(0)) >= ((base_target | float(0)) - 0.5) %}
          {% if window_open_too_long | bool(false) %}
            {% set final_raw = inputs.min_trv_temp | float(12) %}
          {% elif (active_for_demand | bool(false)) and ((base_target | float(0)) > (eco_temp | float(19))) %}
            {# Bang-Bang mit Deadband:
               HIGH = base_target           → bei Erreichen wechsel zu eco (Heizen aus)
               LOW  = base_target − hyst    → bei Unterschreiten wechsel zu comfort (Heizen ein)
               Zwischen LOW und HIGH: aktuellen Zustand halten (sticky → kein Oszillieren). #}
            {% if room_was_writing_comfort | bool(false) %}
              {% if (current_temp | float(0)) >= (base_target | float(0)) %}
