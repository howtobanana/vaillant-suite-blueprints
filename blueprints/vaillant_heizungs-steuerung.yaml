            'base_target': base_target | float(0),
            'final_target': final_target | float(0),
            'current_setpoint': current_setpoint | float(0),
            'current_temp': current_temp | float(0),
            'needs_heat': needs_heat | bool(false),
            'boost_needed': boost_needed | bool(false),
            'boost_deactivate': boost_deactivate | bool(true),
            'mode_label': mode_label | string,
            'hvac_action': hvac_action | string
          }] %}
        {% endfor %}
        {{ ns.items | tojson }}
      rooms_runtime_list: "{{ (rooms_runtime | default('[]', true)) | from_json }}"
      # ===== GROUP 6: WRITE LOGIC FLAGS =====
  # Guard: log a warning if rooms_runtime_list is unexpectedly empty while rooms are configured
  - if:
      - condition: template
        value_template: >
          {% set list = rooms_runtime_list | default([]) %}
          {% set any_enabled = (inputs.room2_enabled or inputs.room3_enabled or inputs.room4_enabled or inputs.room5_enabled or inputs.follower1_enabled or inputs.follower2_enabled) | bool(false) %}
          {{ (list | length == 0) and any_enabled }}
    then:
      - action: system_log.write
        continue_on_error: true
        data:
          level: warning
          message: "Vaillant Blueprint: rooms_runtime_list resolved empty despite enabled rooms – possible template error in rooms_runtime. Check blueprint configuration."
  # ===== STEP 0.005: PRE-HEAT AUTO-OFF =====
  # Master pre-heat auto-off: deactivate when presence ON, schedule active, or timeout exceeded
  - if:
      - "{{ master_pre_heat_active | bool(false) }}"
      - >
        {% set ph_eid = inputs.master_pre_heat_helper | string %}
        {% set now_ts = as_timestamp(now()) | float(0) %}
        {% set ph_changed = as_timestamp(states[ph_eid].last_changed, now_ts) | float(now_ts) if ph_eid not in ['', 'sensor.none', 'none'] else now_ts %}
        {% set timeout_s = (inputs.pre_heat_timeout | float(60)) * 60 %}
        {% set timed_out = (now_ts - ph_changed) >= timeout_s %}
        {% set presence_took_over = master_presence_detected | bool(false) %}
        {% set schedule_took_over = master_schedule_active | bool(false) %}
        {{ timed_out or presence_took_over or schedule_took_over }}
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: "{{ inputs.master_pre_heat_helper }}"
        continue_on_error: true
  # Room pre-heat auto-off: deactivate when presence ON, schedule active, or timeout exceeded
  - repeat:
      for_each: "{{ rooms_runtime_list | default([], true) }}"
      sequence:
        - variables:
            _ph_room: "{{ repeat.item }}"
            _ph_helper: "{{ _ph_room.pre_heat_helper | default('') | string }}"
            _ph_valid: "{{ _ph_helper not in ['', 'sensor.none', 'none'] }}"
            _ph_on: "{{ _ph_valid and ((states(_ph_helper) | string | lower) in ['on', 'true', '1']) }}"
        - if:
            - "{{ _ph_on | bool(false) }}"
            - >
              {% set now_ts = as_timestamp(now()) | float(0) %}
              {% set ph_changed = as_timestamp(states[_ph_helper].last_changed, now_ts) | float(now_ts) if (_ph_valid | bool(false)) else now_ts %}
              {% set timeout_s = (inputs.pre_heat_timeout | float(60)) * 60 %}
              {% set timed_out = (now_ts - ph_changed) >= timeout_s %}
              {% set presence_took_over = (_ph_room.schedule_active | default(false) | bool(false)) or (_ph_room.helper_on | default(false) | bool(false)) or (_ph_room.sensor_on_long_enough | default(false) | bool(false)) %}
              {{ timed_out or presence_took_over }}
          then:
            - action: input_boolean.turn_off
              target:
                entity_id: "{{ _ph_helper }}"
              continue_on_error: true
  # ===== STEP 0.01: HELPER INPUT DEBOUNCE =====
  # Note: This automation uses mode: restart.
  # When a slider is moved (helper_input_trigger), a delay of helper_input_settle_seconds is inserted.
  # If the slider is moved again within that window, mode:restart cancels and restarts the run,
  # which resets the delay — effectively debouncing rapid slider changes.
  # No heating writes are issued during the settle window; this is intentional.
  - choose:
      - conditions:
          - "{{ helper_input_debounce_required | bool(false) }}"
        sequence:
          - delay:
              seconds: "{{ helper_input_settle_seconds }}"
          - choose:
              - conditions:
                  - "{{ helper_input_trigger_entity | string not in ['', 'sensor.none', 'none'] }}"
                  - >
                    {% set helper_entities = [helper_input_trigger_entity] | default([], true) | reject('in', ['', 'sensor.none', 'none']) | list %}
                    {% set so = (expand(helper_entities) | first) if (helper_entities | length) > 0 else none %}
                    {% if so is not none and so.last_changed is defined %}
                      {{ as_timestamp(so.last_changed, 0) > ((helper_input_trigger_ts | float(0)) + 0.5) }}
                    {% else %}
                      {{ false }}
                    {% endif %}
                sequence:
                  - stop: "Neuere Helper-Änderung erkannt - veralteten Lauf beendet."

  # ════════════════════════════════════════════════════════════
  # THERME-KLIMA-VERRIEGELUNG (CO-Schutz)
  # Klima läuft -> Therme/Master HART aus, Leitstand stoppt (kein Gegen-Steuern).
  # Klima aus -> Zustand wiederherstellen, danach läuft der Leitstand normal.
  # Idempotent (Aus nur wenn nötig -> schont API-Budget); wird durch den
  # 3-min-Trigger + ha_start laufend nachgehalten.
  # ════════════════════════════════════════════════════════════
  - variables:
      # Mobile-App-Notify-Services aus den gewählten Geräten (einzige Stelle)
      _notify_targets: >
        {% set raw = inputs.notify_devices %}
        {% set lst = raw if (raw is iterable and raw is not string) else ([raw] if (raw not in ['', none]) else []) %}
        {% set ns = namespace(items=[]) %}
        {% for d in lst %}
          {% set dn = device_attr(d | string | trim, 'name') %}
          {% if dn is string and (dn | trim) != '' %}
            {% set ns.items = ns.items + ['notify.mobile_app_' ~ ((dn | slugify) | replace('-', '_'))] %}
          {% endif %}
        {% endfor %}
        {{ ns.items | unique | list }}
      _tl_off_preset: "{{ inputs.therme_off_preset | default('') | string | trim }}"
      _tl_master_off: >
        {% set p = inputs.therme_off_preset | default('') | string | trim %}
        {% if p != '' %}
          {{ (state_attr(inputs.master_climate, 'preset_mode') | string) == p }}
        {% else %}
          {{ states(inputs.master_climate) == 'off' }}
        {% endif %}
  - choose:
      # ── Verriegelt: Klima läuft -> Therme aus, Leitstand stoppen ──
      - conditions:
          - "{{ therme_lockout_active | bool(false) }}"
        sequence:
          # Snapshot + Push nur bei der EIN-Flanke (einmalig).
          - if:
              - "{{ (trigger.id | default('')) == 'therme_ac_on' }}"
            then:
              - action: scene.create
                data:
                  scene_id: vaillant_therme_lockout
                  snapshot_entities:
                    - "{{ inputs.master_climate }}"
                continue_on_error: true
              - if:
                  - "{{ (_notify_targets | length) > 0 }}"
                then:
                  - repeat:
                      for_each: "{{ _notify_targets }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          data:
                            title: "🔌 Therme aus — Klima läuft"
                            message: "Klima in Betrieb → Therme abgeschaltet.\n(Heizungs-Steuerung)"
                            data:
                              tag: vaillant_therme_lockout
                              push:
                                sticky: true
                          continue_on_error: true
          # Therme aus — nur wenn nicht schon aus (schont API-Budget).
          - if:
              - "{{ not (_tl_master_off | bool(false)) }}"
            then:
              - if:
                  - "{{ _tl_off_preset != '' }}"
                then:
                  - action: climate.set_preset_mode
                    target:
                      entity_id: "{{ inputs.master_climate }}"
                    data:
                      preset_mode: "{{ _tl_off_preset }}"
                    continue_on_error: true
                else:
                  - action: climate.turn_off
                    target:
                      entity_id: "{{ inputs.master_climate }}"
                    continue_on_error: true
          - stop: "Therme-Lockout aktiv — Heizung/Therme aus (CO-Schutz)"

      # ── Entriegeln: Klima ging gerade aus -> Zustand wiederherstellen ──
      - conditions:
          - "{{ (trigger.id | default('')) == 'therme_ac_off' }}"
          - "{{ inputs.therme_lockout_enabled | bool(false) }}"
        sequence:
          - if:
              - "{{ states('scene.vaillant_therme_lockout') not in ['unknown', 'unavailable'] }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: scene.vaillant_therme_lockout
                continue_on_error: true
            else:
              - action: climate.turn_on
                target:
                  entity_id: "{{ inputs.master_climate }}"
                continue_on_error: true
          - if:
              - "{{ (_notify_targets | length) > 0 }}"
            then:
              - repeat:
                  for_each: "{{ _notify_targets }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        title: "🔥 Therme wieder ein"
                        message: "Klima aus → Therme freigegeben, normaler Heizbetrieb.\n(Heizungs-Steuerung)"
                        data:
                          tag: vaillant_therme_lockout
                          push:
                            sticky: true
                      continue_on_error: true
          # KEIN stop -> Leitstand läuft weiter und stellt den Sollwert wieder her.

    # ========== ROOM RUNTIME LOOP LOGIC ==========
  - repeat:
      for_each: "{{ rooms_runtime_list | default([], true) }}"
      sequence:
        - variables:
            room: "{{ repeat.item }}"
            room_ok: "{{ room.room_ok | default(false) | bool(false) }}"
            room_climate: "{{ room.climate | default('', true) | string }}"
            room_role: "{{ room.role | default('', true) | string }}"
            room_comfort_input: "{{ room.comfort_input | default('', true) | string }}"
            room_final_target: "{{ room.final_target | default(0) | float(0) }}"
            room_current_setpoint: "{{ room.current_setpoint | default(0) | float(0) }}"
            delta_abs: "{{ ((room_final_target | float(0)) - (room_current_setpoint | float(0))) | abs }}"
            force_sync: >
              {{
                (room_role == 'isolated')
                and (helper_input_trigger | bool(false))
                and (helper_input_trigger_entity | string | trim == room_comfort_input | string | trim)
              }}
        - choose:
            - conditions:
                - "{{ room_ok | bool(false) }}"
                - "{{ ((delta_abs | float(0)) > (inputs.hysteresis | float(0.6))) or (force_sync | bool(false)) }}"
              sequence:
                - action: climate.set_temperature
                  target:
                    entity_id: "{{ room_climate }}"
                  data:
                    temperature: "{{ room_final_target }}"
                  continue_on_error: true
                # --- TRV write verification ---
                # wait_template statt wait_for_trigger: der Readback kann schon
                # stimmen (optimistisches Update) — dann sofort weiter.
                # Schlafende TRVs melden oft erst nach Sekunden → bis 15 s warten.
                - wait_template: >
                    {{ states(room_climate) in ['unavailable', 'unknown']
                       or (((state_attr(room_climate, 'temperature') | float(-999)) - (room_final_target | float(0))) | abs) <= 0.5 }}
                  timeout: "00:00:15"
                  continue_on_timeout: true
                - variables:
                    trv_readback: >
                      {{ state_attr(room_climate, 'temperature') | float(-999) }}
                    trv_entity_state: >
                      {{ states(room_climate) | default('unknown', true) | string }}
                - choose:
                    - conditions:
                        - >
                          {{
                            trv_entity_state in ['unavailable', 'unknown']
                            or ((trv_readback | float(-999)) - (room_final_target | float(0))) | abs > 0.5
                          }}
                      sequence:
                        - action: persistent_notification.create
                          data:
                            title: "⚠️ TRV Write Failed"
                            message: >
                              {{ state_attr(room_climate, 'friendly_name') | default(room_climate, true) }}
                              antwortet nicht!

                              Soll: {{ room_final_target | round(1) }}°C
                              Readback: {{ trv_readback | round(1) }}°C
                              Entity-State: {{ trv_entity_state }}

                              Gerät offline? Funkverbindung und Batterie prüfen.
                            notification_id: "trv_fail_{{ room_climate | replace('.', '_') }}"
                  default:
                    # TRV antwortet (wieder) → evtl. alte Fehlermeldung entfernen
                    - action: persistent_notification.dismiss
                      continue_on_error: true
                      data:
                        notification_id: "trv_fail_{{ room_climate | replace('.', '_') }}"

  # ===== STEP 5.5: MASTER TARGET AGGREGATION & WRITE =====
  - choose:
      - conditions:
          - "{{ master_climate_available }}"
        sequence:
          - variables:
              _debug_log_enabled: >
                {{ (inputs.enable_leitstand_normal | default(false) | bool(false)) or (inputs.enable_leitstand_expert | default(false) | bool(false)) }}
              master_forced_min_active: >
                {{ (master_rapid_temp_drop | bool(false)) or (master_window_open_too_long | bool(false)) }}
              away_mode_active_effective: >
                {{ away_mode_entity_on | bool(false) }}
              master_safety_floor: >
                {% if away_mode_active_effective | bool(false) %}
                  {{ inputs.min_trv_temp | float(12) }}
                {% else %}
                  {{ eco_temp | float(19) }}
                {% endif %}
              isolated_room_demand_targets: >
                {# Only rooms that actually need heat contribute to master demand.
                   If a room's current temp is already above its target, the TRV
                   won't open — raising the master would waste an API write.
                   Anti-cycling holds prevent rapid oscillation as rooms cross
                   their target threshold. #}
                {% set ns = namespace(vals=[]) %}
                {% for room in rooms_runtime_list | default([], true) %}
                  {% if (room.role | string == 'isolated') and (room.room_ok | default(false) | bool(false)) and (room.active_for_demand | default(false) | bool(false)) and (room.needs_heat | default(false) | bool(false)) %}
                    {% set ns.vals = ns.vals + [room.final_target | float(0)] %}
                  {% endif %}
                {% endfor %}
                {{ ns.vals }}
              master_presence_priority_active: >
                {% if inputs.master_presence_priority_helper | string not in ['', 'sensor.none', 'none'] %}
                  {{ is_state(inputs.master_presence_priority_helper, 'on') }}
                {% else %}
                  {{ inputs.enable_master_presence_priority | bool(false) }}
                {% endif %}
              master_base_required_target: >
                {% set demand_targets = isolated_room_demand_targets | default([]) %}
                {% if master_forced_min_active | bool(false) %}
                  {% set target_raw = master_safety_floor | float(12) %}
                {% elif away_mode_active_effective | bool(false) %}
                  {# Away mode: master uses away_temp directly.
                     Room demands must NOT pull the master above away_temp —
                     the master controls heat delivery for all rooms. #}
                  {% set target_raw = master_target_final | float(0) %}
                {% elif (master_presence_priority_active | bool(false)) and ((master_presence_detected | default(false)) | bool(false)) %}
                  {% set target_raw = master_target_final | float(0) %}
                {% elif demand_targets | length | float(0) > 0 %}
                  {% set max_room_target = (demand_targets | max | float(0)) %}
                  {% set target_raw = [master_target_final | float(0), max_room_target] | max %}
                {% else %}
                  {% set target_raw = master_target_final | float(0) %}
                {% endif %}
                {{ [target_raw | float(0), master_safety_floor | float(12)] | max }}
              weather_compensation_add: >
                {% if not (inputs.enable_weather_compensation | bool(false)) or (summer_mode_active | bool(false)) %}
                  0.0
                {% else %}
                  {% set c_id = inputs.weather_compensation_sensor | string %}
                  {% if c_id not in ['', 'sensor.none', 'none'] and states(c_id) not in ['unknown', 'unavailable', 'none', ''] %}
                    {{ states(c_id) | float(0) }}
                  {% elif outdoor_temp_valid | bool(false) %}
                    {% set outdoor_q = (((outdoor_temp | float(0)) * 2) | round(0) / 2) %}
                    {% if outdoor_q <= -10.0 %}
                      {{ inputs.weather_boost_zone1 | float(0) }}
                    {% elif outdoor_q <= 0.0 %}
                      {{ inputs.weather_boost_zone2 | float(0) }}
                    {% elif outdoor_q < 10.0 %}
                      {{ inputs.weather_boost_zone3 | float(0) }}
                    {% else %}
                      0.0
                    {% endif %}
                  {% else %}
                    0.0
                  {% endif %}
                {% endif %}

              weather_modifier: >
                {% if (inputs.enable_weather_compensation | bool(false)) and (not (master_forced_min_active | bool(false))) and ((master_base_required_target | float(0)) > ((master_safety_floor | float(12)) + 0.1)) %}
                  {{ weather_compensation_add | float(0) }}
                {% else %}
                  0.0
                {% endif %}
              weather_modifier_sanitized: >
                {% set raw = weather_modifier | float(0) %}
                {% set clamped = [[raw, 0.0] | max, 5.0] | min %}
                {{ ((clamped * 2) | round(0) / 2) }}
              master_min: "{{ state_attr(inputs.master_climate, 'min_temp') | float(inputs.min_trv_temp | float(12)) }}"
              master_max: "{{ state_attr(inputs.master_climate, 'max_temp') | float(30) }}"
              # Room boost detection with anti-overshoot hysteresis
              room_boost_enabled_effective: >
                {{ (inputs.enable_room_boost | bool(false)) and (inputs.room_boost_amount | float(0) > 0) and (not (master_forced_min_active | bool(false))) and (not (away_mode_active_effective | bool(false))) and (not (master_window_open_too_long | bool(false))) and (not (summer_mode_active | bool(false))) }}
              master_boost_participates: >
                {{ (master_schedule_active | bool(false)) or (master_presence_detected | bool(false)) or (master_is_manual | bool(false)) }}
              _master_boost_delta: >
                {% if room_boost_enabled_effective | bool(false) and (master_boost_participates | bool(false)) %}
                  {{ master_target_final | float(0) - (master_current_temp | float(0)) }}
                {% else %}
                  {{ none }}
                {% endif %}
              master_needs_boost: >
                {% if _master_boost_delta is not none %}
                  {{ (_master_boost_delta | float(0)) >= (inputs.room_boost_activation_threshold | float(1.0)) }}
                {% else %}
                  {{ false }}
                {% endif %}
              master_boost_deactivate: >
                {% if _master_boost_delta is not none %}
                  {{ (_master_boost_delta | float(0)) < 0.5 }}
                {% else %}
                  {{ true }}
                {% endif %}
              isolated_rooms_boost_eval: >
                {% set ns = namespace(any_needs=false, all_deactivate=true, need_count=0) %}
                {% for room in rooms_runtime_list | default([], true) %}
                  {% if (room.role | string == 'isolated') and (room.room_ok | default(false) | bool(false)) %}
                    {% if room.boost_needed | default(false) | bool(false) %}
                      {% set ns.any_needs = true %}
                      {% set ns.need_count = ns.need_count + 1 %}
                    {% endif %}
                    {% if not (room.boost_deactivate | default(true) | bool(true)) %}
                      {% set ns.all_deactivate = false %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ {'any_needs': ns.any_needs, 'all_deactivate': ns.all_deactivate, 'need_count': ns.need_count} }}
              any_room_needs_boost: >
                {{
                  (master_needs_boost | bool(false)) or
                  ((isolated_rooms_boost_eval.any_needs | default(false)) | bool(false))
                }}
              all_rooms_boost_deactivate: >
                {{
                  (master_boost_deactivate | bool(true)) and
                  ((isolated_rooms_boost_eval.all_deactivate | default(true)) | bool(true))
                }}
              isolated_rooms_boost_count: >
                {{ isolated_rooms_boost_eval.need_count | default(0) | int(0) }}
              master_set_now: "{{ state_attr(inputs.master_climate, 'temperature') | float(0) }}"
              master_boost_active: >
                {{ (any_room_needs_boost | bool(false)) and not (all_rooms_boost_deactivate | bool(false)) }}
              master_boost_amount: >
                {% if master_boost_active | bool(false) %}
                  {{ inputs.room_boost_amount | float(2.0) }}
                {% else %}
                  {{ 0.0 }}
                {% endif %}
              # === Final Modification Pipeline ===
              # 1. Base Target lowered by Humidity
              master_humidity_drop: >
                {{ (master_humidity_dynamic_drop | float(0)) * -1 }}

              # 2. Raw Target (incorporating safety floors)
              master_pure_raw: >
                {% if master_forced_min_active | bool(false) %}
                  {{ inputs.min_trv_temp | float(12) }}
                {% else %}
                  {% set base_raw = [((master_base_required_target | float(0)) + (master_humidity_drop | float(0))), (master_safety_floor | float(12))] | max %}
                  {# Bang-Bang-Hysterese mit Deadband:
                     HIGH = base_raw           → bei Erreichen wechsel zu eco (Brenner aus)
                     LOW  = base_raw − hyst    → bei Unterschreiten wechsel zu comfort (Brenner ein)
                     Zwischen LOW und HIGH: aktuellen Zustand halten (sticky → kein Oszillieren).
                     Aktueller Zustand wird via master_set_now (= bereits geschriebener Setpoint) erkannt.
                     Greift nur, wenn base_raw wirklich über eco liegt — forced-min/away/safety-floor unberührt. #}
                  {% set m_current = master_current_temp | float(21) %}
                  {% set eco_floor = eco_temp | float(inputs.eco_temp_fixed | float(19)) %}
                  {% set eco_result = [eco_floor, master_safety_floor | float(12)] | max %}
                  {% if (base_raw | float(0)) <= (eco_floor | float(0)) %}
                    {{ base_raw }}
                  {% else %}
                    {% set was_writing_comfort = (master_set_now | float(0)) >= ((base_raw | float(0)) - 0.5) %}
                    {% if was_writing_comfort %}
                      {% if (m_current | float(0)) >= (base_raw | float(0)) %}
                        {{ eco_result }}
                      {% else %}
                        {{ base_raw }}
                      {% endif %}
                    {% else %}
                      {% if (m_current | float(0)) < ((base_raw | float(0)) - (inputs.hysteresis | float(0.6))) %}
                        {{ base_raw }}
                      {% else %}
                        {{ eco_result }}
                      {% endif %}
                    {% endif %}
                  {% endif %}
                {% endif %}

              # 3. Apply Max/Min Bounds to Raw Base
              master_pure_bounded: >
                {% set hi = [master_pure_raw | float(0), master_max | float(30)] | min %}
                {{ [hi, master_min | float(inputs.min_trv_temp | float(12))] | max }}

              # 4. The Turbo Package (Only active when heating is needed)
              master_active_modifier: >
                {% set boost_add = (master_boost_amount | float(0)) if (master_boost_active | bool(false)) else 0.0 %}
                {{ (boost_add | float(0)) + (weather_modifier_sanitized | float(0)) }}

              # 5. Final Targets (single source of truth for master writes)
              master_final_raw: >
                {{ (master_pure_bounded | float(0)) + (master_active_modifier | float(0)) }}
              master_final_clamped: >
                {% set hi = [master_final_raw | float(0), master_max | float(30)] | min %}
                {{ [hi, master_min | float(inputs.min_trv_temp | float(12))] | max }}
              master_final_quantized: >
                {% set v = master_final_clamped | float(0) %}
                {{ ((v * 2) | round(0) / 2) }}
              master_final_target: >
                {{ master_final_quantized | float(0) }}
              master_target_delta_abs: "{{ ((master_final_target | float(0)) - (master_set_now | float(0))) | abs }}"
              master_write_kind_current: >
                {% if (master_final_target | float(0)) > ((master_set_now | float(0)) + 0.1) %}
                  raise
                {% elif (master_final_target | float(0)) < ((master_set_now | float(0)) - 0.1) %}
                  drop
                {% else %}
                  sync
                {% endif %}
              master_needs_global_boost: >
                {{ (not (away_mode_active_effective | bool(false))) and ((master_set_now | float(0)) < ((master_base_required_target | float(0)) - 0.1)) }}
              master_needs_global_drop: >
                {{ (not (away_mode_active_effective | bool(false))) and ((master_set_now | float(0)) > ((master_final_target | float(0)) + 0.1)) }}
              master_significant_drop: >
                {# >= 1.5 (not > 2.0): the old strict threshold missed exact 2°C drops
                   (e.g. 21→19) because 2.0 > 2.0 == false. 1.5 catches all meaningful
                   eco-drops after quantization to 0.5°C steps. #}
                {{ ((master_set_now | float(0)) - (master_final_target | float(0))) >= 1.5 }}
              max_changes_per_hour_effective: "{{ [[inputs.max_changes_per_hour | float(10), 5] | max, 20] | min }}"
              # === WRITE LOG PARSING ===
              master_write_log_configured: >
                {{ inputs.master_write_log_helper | string not in ['', 'sensor.none', 'none'] }}
              master_write_log_raw: >
                {% if master_write_log_configured | bool(false) %}
                  {{ states(inputs.master_write_log_helper) | default('', true) | trim }}
                {% else %}
                  {{ '' }}
                {% endif %}
              master_write_log_kind: >
                {% set raw = master_write_log_raw | string %}
                {% if ':' in raw %}
                  {{ raw.split(':')[0] | trim | lower }}
                {% else %}
                  sync
                {% endif %}
              master_write_log_timestamps_raw: >
                {% set raw = master_write_log_raw | string %}
                {% if ':' in raw %}
                  {{ raw.split(':')[1] | default('', true) | trim }}
                {% else %}
                  {{ '' }}
                {% endif %}
              # === SLIDING WINDOW BUDGET ===
              master_write_timestamps_clean: >
                {# FIX: HA auto-types pure-numeric template output to int.
                   When the write log has exactly 1 timestamp (no commas),
                   master_write_log_timestamps_raw becomes int, crashing .split().
                   | string ensures safe string operations regardless of auto-typing. #}
                {% set raw = master_write_log_timestamps_raw | default('', true) | string %}
                {% set now_ts = as_timestamp(now()) | float(0) %}
                {% set entries_raw = raw.split(',') | reject('eq', '') | map('trim') | list %}
                {# Guard: reset log if any entry is non-numeric (corruption) #}
                {% set ns = namespace(valid=[], corrupt=false) %}
                {% for ts in entries_raw %}
                  {% if ts | float(-1) < 0 %}
                    {% set ns.corrupt = true %}
                  {% elif (now_ts - (ts | float(0))) < 3600 %}
                    {% set ns.valid = ns.valid + [ts | string] %}
                  {% endif %}
                {% endfor %}
                {% if ns.corrupt %}
                  {{ '' }}
                {% else %}
                  {# Clamp to budget cap to prevent 255-char overflow #}
                  {% set cap = (max_changes_per_hour_effective | int(10)) %}
                  {{ (ns.valid | list)[-cap:] | join(',') }}
                {% endif %}
              master_write_budget_used: >
                {% set clean = master_write_timestamps_clean | default('', true) | string | trim %}
                {{ (clean.split(',') | reject('eq', '') | list | length) if (clean | length > 0) else 0 }}
              master_write_budget_remaining: >
                {{ (max_changes_per_hour_effective | int(10)) - (master_write_budget_used | int(0)) }}
              master_budget_ok: >
                {{ (master_write_budget_remaining | int(0)) > 0 }}
              # === LAST WRITE AGE (aus letztem Timestamp im Log) ===
              master_last_write_age_s: >
                {% set clean = master_write_timestamps_clean | default('', true) | string | trim %}
                {% set entries = clean.split(',') | reject('eq', '') | list %}
                {% if entries | length > 0 %}
                  {% set last_ts = entries[-1] | float(0) %}
                  {% set now_ts = as_timestamp(now()) | float(0) %}
                  {{ now_ts - last_ts }}
                {% else %}
                  {{ 999999 }}
                {% endif %}
              # === ANTI-CYCLING HOLDS (mit Bypass) ===
              master_hold_bypass: >
                {{
                  trigger_id_safe in [
                    'master_presence_helper_change',
                    'room2_presence_helper_change',
                    'room3_presence_helper_change',
                    'room4_presence_helper_change',
                    'room5_presence_helper_change',
                    'master_comfort_input_change',
                    'room2_comfort_input_change',
                    'room3_comfort_input_change',
                    'room4_comfort_input_change',
                    'room5_comfort_input_change',
                    'eco_temp_input_change',
                    'away_temp_input_change',
                    'away_mode_on', 'away_mode_off',
                    'guest_mode_on', 'guest_mode_off',
                    'ha_start',
                    'master_window_open_30s', 'master_window_closed',
                    'room2_window_open_30s', 'room2_window_closed',
                    'room3_window_open_30s', 'room3_window_closed',
                    'room4_window_open_30s', 'room4_window_closed',
                    'room5_window_open_30s', 'room5_window_closed',
                    'follower1_window_open_30s', 'follower1_window_closed',
                    'follower2_window_open_30s', 'follower2_window_closed'
                  ]
                }}
              master_last_write_kind: >
                {{ master_write_log_kind | default('sync', true) | string }}
              master_hold_drop_after_raise_seconds: >
                {{ (inputs.master_hold_drop_after_raise_minutes | float(20)) * 60 }}
              master_hold_raise_after_drop_seconds: >
                {{ (inputs.master_hold_raise_after_drop_minutes | float(10)) * 60 }}
              master_drop_hold_active: >
                {{
                  (master_last_write_kind | string == 'raise')
                  and
                  ((master_last_write_age_s | float(999999)) < (master_hold_drop_after_raise_seconds | float(1200)))
                }}
              master_raise_hold_active: >
                {{
                  (master_last_write_kind | string == 'drop')
                  and
                  ((master_last_write_age_s | float(999999)) < (master_hold_raise_after_drop_seconds | float(600)))
                }}
              master_needs_raise: >
                {{ (master_final_target | float(0)) > ((master_set_now | float(0)) + (inputs.hysteresis | float(0.6))) }}
              master_raise_allowed: >
                {{
                  (master_needs_raise | bool(false))
                  and
                  (master_budget_ok | bool(false))
                  and
                  (
                    (not (master_raise_hold_active | bool(false)))
                    or (master_forced_min_active | bool(false))
                    or (away_mode_active_effective | bool(false))
                    or (master_hold_bypass | bool(false))
                  )
                }}
              master_drop_allowed: >
                {{
                  (master_needs_global_drop | bool(false))
                  and
                  (master_budget_ok | bool(false))
                  and
                  (
                    (not (master_drop_hold_active | bool(false)))
                    or (master_forced_min_active | bool(false))
                    or (away_mode_active_effective | bool(false))
                    or (master_hold_bypass | bool(false))
                  )
                }}
              # Im Sommer-Aus ist der Master 'off' (Soll = 0) -> kein Sollwert-Write
              master_write_allowed: >
                {{
                  (not (master_forced_min_active | bool(false)))
                  and (not (summer_heat_off_active | bool(false)))
                  and
                  ((master_raise_allowed | bool(false)) or (master_drop_allowed | bool(false)))
                }}
              master_hvac_action: >
                {{ state_attr(inputs.master_climate, 'hvac_action') | default('n/a', true) }}
              master_state: >
                {% if summer_heat_off_active | bool(false) %}
                  SOMMER
                {% elif master_forced_min_active | bool(false) %}
                  FORCED_MIN
                {% elif away_mode_active_effective | bool(false) %}
                  AWAY
                {% elif (master_needs_raise | bool(false)) or (master_boost_active | bool(false)) %}
                  HEATING
                {% else %}
                  ECO
                {% endif %}
              master_reason: >
                {% set ns = namespace(items=[]) %}
                {% if master_forced_min_active | bool(false) %}
                  {% set ns.items = ns.items + ['forced_min'] %}
                {% endif %}
                {% if away_mode_active_effective | bool(false) %}
                  {% set ns.items = ns.items + ['away_mode'] %}
                {% endif %}
                {% if (isolated_room_demand_targets | default([]) | length) > 0 %}
                  {% set ns.items = ns.items + ['room_demand'] %}
                {% endif %}
                {% if master_boost_active | bool(false) %}
                  {% set ns.items = ns.items + ['boost'] %}
                {% endif %}
                {% if (weather_modifier_sanitized | float(0)) > 0 %}
                  {% set ns.items = ns.items + ['weather'] %}
                {% endif %}
                {% if (master_humidity_drop | float(0)) < 0 %}
                  {% set ns.items = ns.items + ['humidity_drop'] %}
                {% endif %}
                {% if (master_final_raw | float(0)) > (master_max | float(30)) %}
                  {% set ns.items = ns.items + ['capped_by_max'] %}
                {% endif %}
                {% if ns.items | length == 0 %}
                  base
                {% else %}
                  {{ ns.items | join(',') }}
                {% endif %}
              # === WRITE-PFAD (einzige Entscheidung, auch fürs Debug-Log) ===
              # S = Sommer-Aus | A = Forced-Min (ohne Budget) | B = starker Drop/Boost
              # (Budget, Raise-Hold) | C = normal (Budget + Holds) | none = nichts
              # Soll-0-Guard: meldet die Vaillant-Cloud kurz Soll 0 (Poll-Artefakt),
              # sind alle Deltas Müll -> nicht gegenregeln; der 3-min-Zyklus holt es nach.
              _write_path: >
                {% set set_ok = (master_set_now | float(0)) > 0 %}
                {% if summer_heat_off_active | bool(false) %}
                  S
                {% elif set_ok and (master_forced_min_active | bool(false)) and ((master_target_delta_abs | float(0)) > 0.5) %}
                  A
                {% elif set_ok and not (master_forced_min_active | bool(false))
                        and ((master_needs_global_boost | bool(false)) or (master_significant_drop | bool(false)))
                        and ((master_target_delta_abs | float(0)) > 0.1)
                        and (master_budget_ok | bool(false))
                        and ((master_significant_drop | bool(false)) or (master_hold_bypass | bool(false))
                             or ((master_needs_global_boost | bool(false)) and not (master_raise_hold_active | bool(false)))) %}
                  B
                {% elif set_ok and (master_write_allowed | bool(false)) %}
                  C
                {% else %}
                  none
                {% endif %}
          # ════════════════════════════════════════════════════════════
          # DEBUG LOG 3: Boost Logic
          # ════════════════════════════════════════════════════════════
          - if:
              - condition: template
                value_template: "{{ _debug_log_enabled | bool(false) }}"
            then:
              - action: system_log.write
                continue_on_error: true
                data:
                  message: >
                    🚀 BOOST LOGIC | isolated_need_count={{ isolated_rooms_boost_count | float(0) | round(0) }} | Boost: active={{ master_boost_active | bool(false) }} amount={{ inputs.room_boost_amount | float(0) }}°C threshold={{ inputs.room_boost_activation_threshold | float(0) }}°C
                  level: info
          # ════════════════════════════════════════════════════════════
          # DEBUG LOG 4: Demand Resolution & Write-Gate
          # ════════════════════════════════════════════════════════════
          - if:
              - condition: template
                value_template: "{{ _debug_log_enabled | bool(false) }}"
            then:
              - action: system_log.write
                continue_on_error: true
                data:
                  level: info
                  message: >
                    {% set _skip_reasons = namespace(items=[]) %}
                    {% if not (master_climate_available | bool(false)) %}
                      {% set _skip_reasons.items = _skip_reasons.items + ['climate_unavailable'] %}
                    {% endif %}
                    {% if master_forced_min_active | bool(false) %}
                      {% set _skip_reasons.items = _skip_reasons.items + ['forced_min_bypasses_write_gate'] %}
                    {% endif %}
                    {% if not (master_budget_ok | bool(false)) %}
                      {% set _skip_reasons.items = _skip_reasons.items + ['budget_exhausted(used=' ~ (master_write_budget_used | int(0)) ~ '/' ~ (max_changes_per_hour_effective | int(10)) ~ ')'] %}
                    {% endif %}
                    {% if master_drop_hold_active | bool(false) %}
                      {% set _skip_reasons.items = _skip_reasons.items + ['drop_hold_active(last_write=' ~ (master_last_write_age_s | int(0)) ~ 's_ago,hold=' ~ (master_hold_drop_after_raise_seconds | int(0)) ~ 's)'] %}
                    {% endif %}
                    {% if master_raise_hold_active | bool(false) %}
                      {% set _skip_reasons.items = _skip_reasons.items + ['raise_hold_active'] %}
                    {% endif %}
                    {% if not (master_needs_global_drop | bool(false)) and not (master_needs_raise | bool(false)) %}
                      {% set _skip_reasons.items = _skip_reasons.items + ['no_delta(set=' ~ (master_set_now | float(0) | round(1)) ~ '_target=' ~ (master_final_target | float(0) | round(1)) ~ ')'] %}
                    {% endif %}
                    {% if master_hold_bypass | bool(false) %}
                      {% set _skip_reasons.items = _skip_reasons.items + ['hold_bypassed_by_trigger'] %}
                    {% endif %}
                    {% set _path_label = {'S': 'S(sommer)', 'A': 'A(forced_min)', 'B': 'B(sig_drop/boost)', 'C': 'C(normal)'} %}
                    🔍 DEMAND RESOLUTION | trigger={{ trigger_id_safe | default('n/a') }}
                    presence_detected={{ master_presence_detected | bool(false) }}
                    schedule_active={{ master_schedule_active | bool(false) }}
                    is_manual={{ master_is_manual | bool(false) }}
                    master_demand={{ master_demand | float(0) | round(1) }}°C
                    master_target_temp={{ master_target_temp | float(0) | round(1) }}°C
                    master_final_target={{ master_final_target | float(0) | round(1) }}°C
                    master_set_now={{ master_set_now | float(0) | round(1) }}°C
                    sig_drop={{ master_significant_drop | bool(false) }}(delta={{ ((master_set_now | float(0)) - (master_final_target | float(0))) | round(2) }})
                    drop_hold={{ master_drop_hold_active | bool(false) }}
                    hold_bypass={{ master_hold_bypass | bool(false) }}
                    budget_ok={{ master_budget_ok | bool(false) }}({{ master_write_budget_remaining | int(0) }} left)
                    write_allowed={{ master_write_allowed | bool(false) }}
                    write_path={{ _path_label.get(_write_path | string, 'NONE(blocked)') }}
                    skip_reasons={{ _skip_reasons.items | join(',') if _skip_reasons.items | length > 0 else 'none' }}

          # Sommer-Ende / kein Sommer-Aus: stand der Master wegen Sommer auf
          # 'Off', wird er einmal wieder eingeschaltet; den korrekten Sollwert
          # schreibt danach der normale Write-Pfad (idempotent, selbstheilend).
          - if:
              - "{{ (not (summer_heat_off_active | bool(false))) and (states(inputs.master_climate) == 'off') }}"
            then:
              - action: climate.turn_on
                target:
                  entity_id: "{{ inputs.master_climate }}"
                continue_on_error: true
          # Preset-Variante des Sommer-Aus: der Status ist dann nie 'off',
          # deshalb muss der Preset beim Saisonende explizit zurueckgesetzt
          # werden, sonst schreibt der Leitstand gegen einen aktiven Preset.
          - if:
              - "{{ (not (summer_heat_off_active | bool(false))) and (_summer_off_preset != '') and ((state_attr(inputs.master_climate, 'preset_mode') | string) == _summer_off_preset) }}"
            then:
              - action: climate.set_preset_mode
                target:
                  entity_id: "{{ inputs.master_climate }}"
                data:
                  preset_mode: "none"
                continue_on_error: true
          - choose:
              # PATH S (SOMMER): Heizung aus, Warmwasser bleibt. Idempotent —
              # nur schalten, wenn nicht schon aus (schont API-Budget). Kein
              # set_temperature; Frostschutz übernimmt der Zonen-Aus-Modus.
              - conditions:
                  - "{{ _write_path == 'S' }}"
                sequence:
                  # Live-Check statt Variable vom Lauf-Start: nach einem
                  # Scene-Restore der Klima-Verriegelung im selben Lauf waere
                  # ein zu Beginn eingefrorener Wert veraltet.
                  - if:
                      - >
                        {% if (_summer_off_preset | default('') | string) != '' %}
                          {{ (state_attr(inputs.master_climate, 'preset_mode') | string) != _summer_off_preset }}
                        {% else %}
                          {{ states(inputs.master_climate) != 'off' }}
                        {% endif %}
                    then:
                      - if:
                          - "{{ _summer_off_preset != '' }}"
                        then:
                          - action: climate.set_preset_mode
                            target:
                              entity_id: "{{ inputs.master_climate }}"
                            data:
                              preset_mode: "{{ _summer_off_preset }}"
                            continue_on_error: true
                        else:
                          - action: climate.turn_off
                            target:
                              entity_id: "{{ inputs.master_climate }}"
                            continue_on_error: true
                      # Verifikation analog PATH A/B: kommt der Aus-Zustand
                      # nicht an, Warnung loggen. Retry macht der 3-min-Zyklus.
                      - wait_template: >
                          {% if (_summer_off_preset | default('') | string) != '' %}
                            {{ (state_attr(inputs.master_climate, 'preset_mode') | string) == _summer_off_preset }}
                          {% else %}
                            {{ states(inputs.master_climate) == 'off' }}
                          {% endif %}
                        timeout: "00:00:20"
                        continue_on_timeout: true
                      - if:
                          - "{{ not (wait.completed | default(false) | bool(false)) }}"
                        then:
                          - action: system_log.write
                            continue_on_error: true
                            data:
                              level: warning
                              message: >
                                Vaillant Blueprint: PATH S Sommer-Abschaltung nicht bestaetigt (Master weiterhin '{{ states(inputs.master_climate) }}')
              # PATH A/B/C: Sollwert schreiben. Write-Log SOFORT nach dem API-Call
              # (vor dem wait), sonst kann mode:restart den Lauf vor dem Log
              # abbrechen -> ungezählter Write, Budget kaputt.
              - conditions:
                  - "{{ _write_path in ['A', 'B', 'C'] }}"
                sequence:
                  - action: climate.set_temperature
                    target:
                      entity_id: "{{ inputs.master_climate }}"
                    data:
                      temperature: "{{ master_final_target }}"
                    continue_on_error: true
                  - if:
                      - "{{ master_write_log_configured | bool(false) }}"
                    then:
                      - action: input_text.set_value
                        target:
                          entity_id: "{{ inputs.master_write_log_helper }}"
                        data:
                          value: >
                            {% set kind = master_write_kind_current | default('sync', true) | string %}
                            {% set existing = master_write_timestamps_clean | default('', true) | string | trim %}
                            {% set now_ts = as_timestamp(now()) | int(0) | string %}
                            {% set new_ts = (existing ~ ',' ~ now_ts) if (existing | length > 0) else now_ts %}
                            {{ kind ~ ':' ~ new_ts }}
                        continue_on_error: true
                  - wait_template: >
                      {{ (((state_attr(inputs.master_climate, 'temperature') | float(0)) - (master_final_target | float(0))) | abs) < 0.11 }}
                    timeout: "00:00:20"
                    continue_on_timeout: true
                  - if:
                      - "{{ not (wait.completed | default(false) | bool(false)) }}"
                    then:
                      - action: system_log.write
                        continue_on_error: true
                        data:
                          level: warning
                          message: >
                            Vaillant Blueprint: PATH {{ _write_path }} master write verification timeout (target={{ master_final_target | float(0) }}, actual={{ state_attr(inputs.master_climate, 'temperature') | float(0) }})
          - if:
              - condition: template
                value_template: >
                  {% set age_s = master_last_write_age_s | float(999999) %}
                  {% set verify_window_s = 300.0 %}
                  {% set master_entity = inputs.master_climate | string %}
                  {% set master_state = states(master_entity) if master_entity not in ['', 'sensor.none', 'none'] else '' %}
                  {% set master_entity_valid = (master_entity not in ['', 'sensor.none', 'none']) and (master_state not in ['unknown', 'unavailable', 'none', '']) %}
                  {% set actual = (state_attr(master_entity, 'temperature') | float(0)) if master_entity_valid else 0.0 %}
                  {% set mismatch = ((actual | float(0)) - (master_final_target | float(0))) | abs %}
                  {{ (_debug_log_enabled | bool(false)) and (master_entity_valid | bool(false)) and (age_s <= verify_window_s) and ((mismatch | float(0)) > 0.11) }}
            then:
              - action: system_log.write
                continue_on_error: true
                data:
                  level: warning
                  message: >
                    MASTER VERIFY (restart-safe) mismatch | requested={{ master_final_target | float(0) }} actual={{ state_attr(inputs.master_climate, 'temperature') | float(0) }} delta={{ ((state_attr(inputs.master_climate, 'temperature') | float(0)) - (master_final_target | float(0))) | round(3) }}

  # ════════════════════════════════════════════════════════════
  # LEITSTAND: gemeinsame Bausteine für Normal, Expert und Push
  # ════════════════════════════════════════════════════════════
  - variables:
      _quiet_active: >
        {% if inputs.quiet_schedule | default('') | string | trim not in ['', 'none', 'None'] %}
          {{ is_state(inputs.quiet_schedule, 'on') }}
        {% else %}
          {{ false }}
        {% endif %}
      _leitstand_normal: "{{ inputs.enable_leitstand_normal | default(false) | bool(false) and not (_quiet_active | bool(false)) }}"
      _leitstand_expert: "{{ inputs.enable_leitstand_expert | default(false) | bool(false) and not (_quiet_active | bool(false)) }}"
      _notify_configured: "{{ (_notify_targets | length) > 0 and not (_quiet_active | bool(false)) }}"
      _alert_notify_configured: "{{ (_notify_targets | length) > 0 }}"
      # Event = kein Routine-Lauf ODER in diesem Lauf wurde ein Sollwert geschrieben
      _is_demand_event: >
        {{
          trigger_id_safe | default('manual') != 'scheduled'
          or ((_write_path | default('none', true) | string) in ['A', 'B', 'C'])
        }}
      _l_m_target: "{{ master_final_target | default(0) | float(0) }}"
      _l_m_forced: "{{ master_forced_min_active | default(false) | bool(false) }}"
      _l_m_away_raw: "{{ away_mode_raw | default(false) | bool(false) }}"
      _l_m_guest: "{{ guest_mode_on | default(false) | bool(false) }}"
      _l_m_window: "{{ master_window_open_too_long | default(false) | bool(false) }}"
      _l_m_pre_heat: "{{ master_pre_heat_active | default(false) | bool(false) }}"
      _l_summer: "{{ summer_heat_off_active | default(false) | bool(false) }}"
      _l_m_mode_modus: "{{ 'Sommer (Heizung aus)' if (_l_summer | bool(false)) else ('Fenster offen' if (_l_m_window | bool(false)) else ('Not-Aus' if (_l_m_forced | bool(false)) else ('Gast-Modus' if (_l_m_guest | bool(false) and _l_m_away_raw | bool(false)) else ('Abwesend' if ((away_mode_entity_on | default(false) | bool(false)) and not (_l_m_pre_heat | bool(false))) else ('PreHeat' if (_l_m_pre_heat | bool(false)) else 'Heizbetrieb'))))) }}"
      _l_master_head: "🌡️ **Master — {{ master_state | default('ECO', true) }} / {{ _l_m_mode_modus }}** ({{ master_reason | default('base', true) }})"
      _l_temp_line: >-
        {%- set ist = (master_current_temp | float(21)) | round(1) -%}
        {%- if _l_summer | bool(false) -%}
          💤 Heizung aus (WW läuft) | Ist {{ ist }}°C
        {%- else -%}
          {{ '🔥' if (master_hvac_action | default('n/a', true)) == 'heating' else '💤' }} Heizen | Ist {{ ist }}°C → Soll {{ (_l_m_target | float(0)) | round(1) }}°C
        {%- endif -%}
      _l_flags_line: >-
        {{ '✅' if (master_presence_detected | default(false) | bool(false)) else '⬜' }} Präsenz | {{ '✅' if (master_schedule_active | default(false) | bool(false)) else '⬜' }} Zeitplan | {{ '✅' if (master_is_manual | default(false) | bool(false)) else '⬜' }} Manuell | {{ '✅' if ((master_sensors_valid | default(false) | bool(false)) or (master_helper_valid | default(false) | bool(false))) else '⬜' }} Sensoren | {{ '🔥' if (_l_m_pre_heat | bool(false)) else '⬜' }} PreHeat{{ ' 🪟' if (_l_m_window | bool(false)) else '' }}
      _l_write_age: >-
        {%- set age = master_last_write_age_s | default(0) | float(0) -%}
        {{ (age // 60) | int }}m {{ (age % 60) | int }}s
      _l_write_line: >-
        {%- set p = _write_path | default('none', true) | string -%}
        {%- if p == 'S' -%}
          {%- set st = 'Sommer (kein Sollwert-Write)' -%}
        {%- elif p in ['A', 'B', 'C'] -%}
          {%- set st = 'Geschrieben (Pfad ' ~ p ~ ')' -%}
        {%- elif not (master_needs_raise | default(false) | bool(false)) and not (master_needs_global_drop | default(false) | bool(false)) -%}
          {%- set st = 'Blockiert (kein Δ)' -%}
        {%- else -%}
          {%- set st = 'Blockiert (Cooldown/Hold)' -%}
        {%- endif -%}
        🚧 {{ st }} | Budget {{ master_write_budget_remaining | default(0) | int(0) }}/{{ max_changes_per_hour_effective | default(10) | int(10) }} | Write vor {{ _l_write_age }}
      # Räume einmal aufbereiten; die Ausgaben unten formatieren nur noch
      _l_rooms: >
        {%- set ns = namespace(items=[]) -%}
        {%- for room in rooms_runtime_list | default([], true) if room.enabled | default(false) | bool(false) -%}
          {%- set cid = room.climate | default('') | string -%}
          {%- set rk = room.key | default('?') | string -%}
          {%- set wid = room.window | default('') | string -%}
          {%- set dev = ('✅' if (room.climate_ok | default(false) | bool(false)) else '❌') ~ 'TRV' -%}
          {%- if wid not in ['', 'sensor.none', 'none'] -%}
            {%- set dev = dev ~ '  ' ~ ('✅' if states(wid) not in ['unknown', 'unavailable'] else '❌') ~ 'Fenster' -%}
          {%- endif -%}
          {%- if (room.presence_sensors_sanitized | default([]) | length) > 0 -%}
            {%- set dev = dev ~ '  ✅Präsenz' -%}
          {%- endif -%}
          {%- set ft = room.final_target | default(0) | float(0) -%}
          {%- set ct = room.current_temp | default(0) | float(0) -%}
          {%- set ns.items = ns.items + [{
                'label': ((state_attr(cid, 'friendly_name') | default(rk, true)) if (room.room_ok | default(false) | bool(false)) else rk) | string,
                'ft': ft | round(1),
                'ct': ct | round(1),
                'rd': ((ft - ct) | abs) | round(1),
                'ml': room.mode_label | default('n/a') | string,
                'icon': '🔥' if (room.hvac_action | default('n/a')) == 'heating' else '💤',
                'window': ' 🪟' if (room.window_open_too_long | default(false) | bool(false)) else '',
                'active': room.active_for_demand | default(false) | bool(false),
                'dev': dev
              }] -%}
        {%- endfor -%}
        {{ ns.items }}
      _l_rooms_disabled: "{{ rooms_runtime_list | default([], true) | rejectattr('enabled') | map(attribute='key') | list }}"

  # ════════════════════════════════════════════════════════════
  # LEITSTAND NORMAL: Demand-only Dashboard (überschreibt sich selbst)
  # ════════════════════════════════════════════════════════════
  - if:
      - "{{ _leitstand_normal | bool(false) }}"
      - "{{ _is_demand_event | bool(false) }}"
    then:
      - action: persistent_notification.create
        continue_on_error: true
        data:
          notification_id: "vaillant_leitstand"
          title: "🔥 Vaillant Leitstand ({{ now().strftime('%H:%M:%S') }})"
          message: >-
            {%- set n = '\n' -%}
            {%- set msg = namespace(out='') -%}
            {%- set msg.out = '🚨 Trigger: ' ~ (trigger_id_safe | default('manual')) ~ ' | Boost ' ~ ('AN' if (master_boost_active | default(false) | bool(false)) else 'AUS') ~ ' | Wetter ' ~ ((weather_modifier_sanitized | default(0) | float(0)) | round(1)) ~ '°C | Away ' ~ ('✅' if (_l_m_away_raw | bool(false)) else '⬜') ~ ' | Gast ' ~ ('✅' if (_l_m_guest | bool(false)) else '⬜') -%}
            {%- set msg.out = msg.out ~ n ~ n ~ _l_master_head ~ n ~ _l_temp_line -%}
            {%- if not (_l_summer | bool(false)) -%}
              {%- set msg.out = msg.out ~ ' | Komfort ' ~ ((master_comfort_temp | default(0) | float(0)) | round(1)) ~ '°C' -%}
            {%- endif -%}
            {%- set msg.out = msg.out ~ n ~ _l_flags_line ~ n ~ n ~ '🚪 **Räume**' -%}
            {%- for r in _l_rooms -%}
              {%- set msg.out = msg.out ~ n ~ '▸ ' ~ r.label ~ ': ' ~ r.ft ~ '°C — ' ~ r.ml ~ ' ' ~ r.icon ~ r.window ~ n ~ '  ' ~ r.dev -%}
            {%- endfor -%}
            {%- if _l_rooms_disabled | length > 0 -%}
              {%- set msg.out = msg.out ~ n ~ '▸ Deaktiviert: ' ~ (_l_rooms_disabled | join(', ')) -%}
            {%- endif -%}
            {{ msg.out ~ n ~ n ~ _l_write_line }}
      - if:
          - "{{ _notify_configured | bool(false) }}"
        then:
          - repeat:
              for_each: "{{ _notify_targets }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "📣 Heizung Leitstand"
                    message: >-
                      {%- set n = '\n' -%}
                      {%- set msg = namespace(out='') -%}
                      {%- set msg.out = '🌡️ Master: ' ~ (master_state | default('ECO', true)) ~ ' / ' ~ _l_m_mode_modus ~ n ~ _l_temp_line -%}
                      {%- set msg.out = msg.out ~ n ~ '🚧 Budget ' ~ (master_write_budget_remaining | default(0) | int(0)) ~ '/' ~ (max_changes_per_hour_effective | default(10) | int(10)) -%}
                      {%- for r in _l_rooms -%}
                        {%- set msg.out = msg.out ~ n ~ '▸ ' ~ r.label ~ ': ' ~ r.ft ~ '°C ' ~ r.ml ~ ' ' ~ r.icon -%}
                      {%- endfor -%}
                      {{ msg.out }}
                    data:
                      tag: vaillant_heizung_leitstand
                      push:
                        sticky: true

  # ════════════════════════════════════════════════════════════
  # LEITSTAND EXPERT: Verlauf (jeder Lauf, nur als persistent notification)
  # ════════════════════════════════════════════════════════════
  - if:
      - "{{ _leitstand_expert | bool(false) }}"
    then:
      - action: persistent_notification.create
        continue_on_error: true
        data:
          notification_id: "vaillant_expert_leitstand"
          title: "🔍 Expert Leitstand ({{ now().strftime('%H:%M:%S') }})"
          message: >-
            {%- set n = '\n' -%}
            {%- set msg = namespace(out='') -%}
            {%- set msg.out = '🚨 Trigger: ' ~ (trigger_id_safe | default('manual')) ~ ' | Boost ' ~ ('AN' if (master_boost_active | default(false) | bool(false)) else 'AUS') ~ ' | Wetter ' ~ ((weather_modifier_sanitized | default(0) | float(0)) | round(1)) ~ '°C | Feucht. ' ~ ((master_humidity_drop | default(0) | float(0)) | round(1)) ~ '°C' -%}
            {%- set msg.out = msg.out ~ n ~ 'Away ' ~ ('✅' if (_l_m_away_raw | bool(false)) else '⬜') ~ ' | Gast ' ~ ('✅' if (_l_m_guest | bool(false)) else '⬜') ~ ' | Entität: ' ~ (inputs.master_climate | default('n/a')) -%}
            {%- set msg.out = msg.out ~ n ~ n ~ _l_master_head ~ n ~ _l_temp_line -%}
            {%- if not (_l_summer | bool(false)) -%}
              {%- set msg.out = msg.out ~ ' | Base ' ~ ((master_base_required_target | default(0) | float(0)) | round(1)) ~ '°C | Eco ' ~ ((eco_temp | default(0) | float(0)) | round(1)) ~ '°C | Δ=' ~ ((master_target_delta_abs | default(0) | float(0)) | round(1)) -%}
            {%- endif -%}
            {%- set msg.out = msg.out ~ n ~ _l_flags_line ~ n ~ n ~ '🚪 **Räume**' -%}
            {%- for r in _l_rooms -%}
              {%- set msg.out = msg.out ~ n ~ '▸ ' ~ r.label ~ ': ' ~ r.ft ~ '°C (Ist ' ~ r.ct ~ '°C Δ=' ~ r.rd ~ ') — ' ~ r.ml ~ ' ' ~ r.icon ~ r.window ~ (' — aktiv' if r.active else '') ~ n ~ '  ' ~ r.dev -%}
            {%- endfor -%}
            {%- if _l_rooms_disabled | length > 0 -%}
              {%- set msg.out = msg.out ~ n ~ '▸ Deaktiviert: ' ~ (_l_rooms_disabled | join(', ')) -%}
            {%- endif -%}
            {%- set msg.out = msg.out ~ n ~ n ~ _l_write_line -%}
            {%- set msg.out = msg.out ~ n ~ 'Raise ' ~ ('✅' if (master_needs_raise | default(false) | bool(false)) else '⬜') ~ ' | Drop ' ~ ('✅' if (master_needs_global_drop | default(false) | bool(false)) else '⬜') ~ ' | Hold ' ~ ('✅' if (master_drop_hold_active | default(false) | bool(false)) or (master_raise_hold_active | default(false) | bool(false)) else '⬜') ~ ' | Bypass ' ~ ('✅' if (master_hold_bypass | default(false) | bool(false)) else '⬜') ~ ' | Letzter: ' ~ (master_last_write_kind | default('?')) ~ ' vor ' ~ _l_write_age -%}
            {{ msg.out }}

  # ════════════════════════════════════════════════════════════
  # ALWAYS-ON ALERT: Fires only on critical problems, auto-dismisses
  # Skip on ha_start — Sensoren sind nach Restart kurz unavailable
  # ════════════════════════════════════════════════════════════
  - variables:
      _alert_problems: >
        {%- set ns = namespace(items=[]) -%}
        {%- if trigger.id | default('manual') == 'ha_start' -%}
          {{ ns.items }}
        {%- else -%}
        {%- if not (master_climate_available | bool(false)) -%}
          {%- set ns.items = ns.items + ['🔴 Master-Thermostat offline!'] -%}
        {%- endif -%}
        {%- if _l_m_forced | default(false) | bool(false) and not (_l_m_window | default(false) | bool(false)) -%}
          {%- set ns.items = ns.items + ['🔴 NOT-AUS aktiv — Master auf Minimum (' ~ (inputs.min_trv_temp | float(12)) ~ '°C)'] -%}
        {%- endif -%}
        {%- if (master_write_budget_remaining | default(1) | int(1)) <= 0 -%}
          {%- set ns.items = ns.items + ['🟡 API-Budget erschöpft'] -%}
        {%- endif -%}
        {%- set master_ts = inputs.master_temp_sensor | default('') | string -%}
        {%- if master_ts not in ['', 'sensor.none', 'none'] and states(master_ts) in ['unavailable', 'unknown'] -%}
          {%- set ns.items = ns.items + ['🟠 Temp-Sensor offline: Master'] -%}
        {%- endif -%}
        {%- for room in rooms_runtime_list | default([], true) -%}
          {%- if room.enabled | default(false) | bool(false) -%}
            {%- set ts_eid = room.temp_sensor | default('') | string -%}
            {%- if ts_eid not in ['', 'sensor.none', 'none'] and states(ts_eid) in ['unavailable', 'unknown'] -%}
              {%- set rl = state_attr(room.climate | default(''), 'friendly_name') | default(room.key | default('?'), true) -%}
              {%- set ns.items = ns.items + ['🟠 Temp-Sensor offline: ' ~ rl] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.items }}
        {%- endif -%}
  - choose:
      - conditions:
          - "{{ (_alert_problems | length) > 0 }}"
        sequence:
          - action: persistent_notification.create
            continue_on_error: true
            data:
              notification_id: "vaillant_alert"
              title: "⚠️ Heizung — Problem erkannt"
              message: >-
                {%- set n = '\n' -%}
                {%- set msg = namespace(out='') -%}
                {%- for item in _alert_problems -%}
                  {%- if not loop.first -%}{%- set msg.out = msg.out ~ n -%}{%- endif -%}
                  {%- set msg.out = msg.out ~ item -%}
                {%- endfor -%}
                {%- set msg.out = msg.out ~ n ~ n ~ '🕐 Erkannt: ' ~ now().strftime('%H:%M:%S') -%}
                {{ msg.out }}
          # Mobile Push nur auf echte State-Changes, nicht bei 3-min-time_pattern-Polls.
          # Persistent Notification (oben) wird weiterhin auf jeden Eval aktualisiert — das
          # ist idempotent über die fixe notification_id. Das Handy-Spam kommt nur durch den
          # repeat-push, den wir hier throtteln.
          - if:
              - "{{ _alert_notify_configured | bool(false) }}"
              - "{{ trigger.id | default('') != 'scheduled' }}"
            then:
              - repeat:
                  for_each: "{{ _notify_targets }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        title: "⚠️ Heizung — Problem erkannt"
                        message: >-
                          {%- set n = '\n' -%}
                          {%- set msg = namespace(out='') -%}
                          {%- for item in _alert_problems -%}
                            {%- if not loop.first -%}{%- set msg.out = msg.out ~ n -%}{%- endif -%}
                            {%- set msg.out = msg.out ~ item -%}
                          {%- endfor -%}
                          {{ msg.out }}
                        data:
                          tag: vaillant_sensor_alert
                          push:
                            sticky: true
      - conditions:
          - "{{ (_alert_problems | length) == 0 }}"
        sequence:
          - action: persistent_notification.dismiss
            continue_on_error: true
            data:
              notification_id: "vaillant_alert"

mode: restart
