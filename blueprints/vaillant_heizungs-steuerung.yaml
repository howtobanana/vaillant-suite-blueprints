  - trigger: template
    value_template: >
      {{ (tv_follower1_window | string not in ['', 'sensor.none', 'none']) and is_state(tv_follower1_window, 'off') }}
    id: follower1_window_closed
  - trigger: template
    value_template: >
      {{ (tv_follower2_window | string not in ['', 'sensor.none', 'none']) and is_state(tv_follower2_window, 'on') }}
    for:
      seconds: !input window_heat_delay
    id: follower2_window_open_30s
  - trigger: template
    value_template: >
      {{ (tv_follower2_window | string not in ['', 'sensor.none', 'none']) and is_state(tv_follower2_window, 'off') }}
    id: follower2_window_closed
  - trigger: template
    value_template: >
      {{ (tv_master_window | string not in ['', 'sensor.none', 'none']) and is_state(tv_master_window, 'on') }}
    for:
      seconds: !input window_heat_delay
    id: master_window_open_30s
  - trigger: template
    value_template: >
      {{ (tv_master_window | string not in ['', 'sensor.none', 'none']) and is_state(tv_master_window, 'off') }}
    id: master_window_closed

  # ============================================
  # HELPER INPUT TRIGGERS (IMMEDIATE REACTION)
  # trigger: event avoids HA schema validation of entity_id at load time,
  # so empty "" defaults no longer crash the automation on startup.
  # An empty event_data.entity_id simply never matches any real event.
  # ============================================
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input eco_temp_input
    id: eco_temp_input_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input away_temp_input
    id: away_temp_input_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input master_comfort_input
    id: master_comfort_input_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input room2_comfort_input
    id: room2_comfort_input_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input room3_comfort_input
    id: room3_comfort_input_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input room4_comfort_input
    id: room4_comfort_input_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input room5_comfort_input
    id: room5_comfort_input_change
  - trigger: template
    value_template: >
      {% set helpers = tv_away_mode_boolean | default([], true) | reject('in', ['', 'sensor.none', 'none']) | list %}
      {{ (helpers | length > 0) and ((expand(helpers) | selectattr('state', 'eq', 'on') | list | length) > 0) }}
    id: away_mode_on
  - trigger: template
    value_template: >
      {% set helpers = tv_away_mode_boolean | default([], true) | reject('in', ['', 'sensor.none', 'none']) | list %}
      {% set on_count = expand(helpers) | selectattr('state', 'eq', 'on') | list | length %}
      {% set off_count = expand(helpers) | selectattr('state', 'eq', 'off') | list | length %}
      {{ (helpers | length > 0) and ((on_count + off_count) == (helpers | length)) and (on_count == 0) }}
    id: away_mode_off
  - trigger: template
    value_template: >
      {% set eid = tv_guest_mode_boolean | default('') | string %}
      {{ eid not in ['', 'sensor.none', 'none'] and is_state(eid, 'on') }}
    id: guest_mode_on
  - trigger: template
    value_template: >
      {% set eid = tv_guest_mode_boolean | default('') | string %}
      {% set valid = eid not in ['', 'sensor.none', 'none'] %}
      {{ valid and is_state(eid, 'off') }}
    id: guest_mode_off

  # ============================================
  # PRESENCE HELPER TRIGGERS
  # Same trigger: event pattern – avoids entity_id schema validation crash.
  # ============================================
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input master_presence_helper
    id: master_presence_helper_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input room2_presence_helper
    id: room2_presence_helper_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input room3_presence_helper
    id: room3_presence_helper_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input room4_presence_helper
    id: room4_presence_helper_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input room5_presence_helper
    id: room5_presence_helper_change

  # ============================================
  # SCHEDULED TRIGGER (for temp logic)
  # ============================================
  - trigger: time_pattern
    minutes: "/3"
    id: scheduled

  # ============================================
  # HA START TRIGGER (immediate evaluation on restart)
  # ============================================
  - trigger: homeassistant
    event: start
    id: ha_start

  # ============================================
  # SOMMERMODUS: Schalter-Änderung (auto ODER manuell) -> Leitstand sofort
  # neu rechnen. Die Erkennung selbst läuft als Abgleich in jedem Lauf.
  # ============================================
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input summer_mode_boolean
    id: summer_mode_changed

  # ============================================
  # THERME-KLIMA-VERRIEGELUNG: Klima an/aus
  # ============================================
  - trigger: template
    value_template: >
      {% set en = tv_therme_lockout_enabled | default(false) | bool(false) %}
      {% set ac = tv_therme_lockout_ac | default('') | string | trim %}
      {{ en and (ac not in ['', 'none', 'None', 'sensor.none']) and (states(ac) not in ['off', 'unavailable', 'unknown', '', 'none']) }}
    id: therme_ac_on
  - trigger: template
    value_template: >
      {% set en = tv_therme_lockout_enabled | default(false) | bool(false) %}
      {% set ac = tv_therme_lockout_ac | default('') | string | trim %}
      {{ en and (ac not in ['', 'none', 'None', 'sensor.none']) and (states(ac) == 'off') }}
    id: therme_ac_off

conditions: []

actions:
  # ============================================
  # PRESENCE STATE MANAGEMENT
  # ============================================
  - variables:
      presence_activation_delay: !input presence_activation_delay
      presence_deactivation_delay: !input presence_deactivation_delay
      enable_leitstand_normal: !input enable_leitstand_normal
      enable_leitstand_expert: !input enable_leitstand_expert
      _presence_debug_enabled: >
        {{ (enable_leitstand_normal | default(false) | bool(false)) or (enable_leitstand_expert | default(false) | bool(false)) }}
  # Präsenz-Helper setzen: ein Branch für master/room2–5 × on/off
  - if:
      - condition: trigger
        id:
          - master_presence_on
          - master_presence_off
          - room2_presence_on
          - room2_presence_off
          - room3_presence_on
          - room3_presence_off
          - room4_presence_on
          - room4_presence_off
          - room5_presence_on
          - room5_presence_off
    then:
      - variables:
          _presence_helpers:
            master: !input master_presence_helper
            room2: !input room2_presence_helper
            room3: !input room3_presence_helper
            room4: !input room4_presence_helper
            room5: !input room5_presence_helper
          _presence_room: "{{ trigger.id.split('_presence_')[0] }}"
          _presence_on: "{{ trigger.id.endswith('_on') }}"
          presence_helper_entity: "{{ _presence_helpers[_presence_room] | default('', true) | string }}"
      - condition: template
        value_template: "{{ (presence_helper_entity not in ['', 'sensor.none', 'none']) and (presence_helper_entity | length > 5) }}"
      - if:
          - "{{ _presence_on | bool(false) }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: "{{ presence_helper_entity }}"
        else:
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ presence_helper_entity }}"
      - if:
          - condition: template
            value_template: "{{ _presence_debug_enabled | bool(false) }}"
        then:
          - action: system_log.write
            data:
              message: >
                Vaillant Blueprint: {{ _presence_room }} Presence {{ 'ACTIVATED' if (_presence_on | bool(false)) else 'DEACTIVATED' }}
                (Sensor {{ 'ON' if (_presence_on | bool(false)) else 'OFF' }} > {{ presence_activation_delay if (_presence_on | bool(false)) else presence_deactivation_delay }} min)
              level: info
      - stop: ""

  # ===== STARTSCHUTZ: Sensoren nach HA-Start/Reload laden lassen =====
  # Ohne Wartezeit sind Temp-Sensoren noch unavailable → Fallback-Werte (21°C)
  # → falsche Setpoints. Gilt für JEDEN Trigger: mit mode:restart würde sonst
  # ein time_pattern- oder Fenster-Lauf in den ersten 120 s den ha_start-Delay
  # abbrechen und ohne Wartezeit schreiben. this.last_changed = Laden der
  # Automation (HA-Start oder Reload).
  - variables:
      _startup_wait_s: >
        {{ [120 - (as_timestamp(now()) - as_timestamp(this.last_changed, 0)), 0] | max | int(0) }}
  - if:
      - "{{ (_startup_wait_s | int(0)) > 0 }}"
    then:
      - delay:
          seconds: "{{ _startup_wait_s }}"

  # ===== SOMMERMODUS-ABGLEICH =====
  # Level- statt flankengesteuert: jeder Lauf (mind. alle 3 min) gleicht den
  # Schalter mit dem 72h-Außen-Mittel ab. Übersteht HA-Neustarts; im Band
  # zwischen den Schwellen bleibt der Schalter wie er ist (auch manuell).
  # Nach dem Umschalten stoppen — summer_mode_changed startet den Lauf neu.
  - variables:
      _summer_boolean: !input summer_mode_boolean
      _summer_mean_sensor: !input summer_outdoor_mean_sensor
      _summer_limit: !input summer_heating_limit
      _summer_target: >
        {% set b = _summer_boolean | default('') | string | trim %}
        {% set s = _summer_mean_sensor | default('') | string | trim %}
        {% if b in ['', 'none', 'sensor.none'] or s in ['', 'none', 'sensor.none'] or not has_value(s) or not has_value(b) %}
          keep
        {% else %}
          {% set mean = states(s) | float(0) %}
          {% set limit = _summer_limit | float(15) %}
          {% if is_state(b, 'off') and mean >= limit + 1.5 %}
            on
          {% elif is_state(b, 'on') and mean < limit - 1.5 %}
            off
          {% else %}
            keep
          {% endif %}
        {% endif %}
  - if:
      - "{{ _summer_target in ['on', 'off'] }}"
    then:
      - if:
          - "{{ _summer_target == 'on' }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: "{{ _summer_boolean }}"
        else:
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ _summer_boolean }}"
      - action: system_log.write
        continue_on_error: true
        data:
          level: info
          message: >
            Vaillant Blueprint: Sommermodus {{ 'AKTIVIERT' if _summer_target == 'on' else 'DEAKTIVIERT' }}
            (Aussen-Mittel {{ states(_summer_mean_sensor) }} °C, Heizgrenze {{ _summer_limit }} °C ±1,5)
      - stop: "Sommermodus umgeschaltet — Neuberechnung über summer_mode_changed."

  # ===== PRESENCE HELPER SYNC (ha_start / scheduled) =====
  # Template triggers need a False→True transition to fire. After HA restart
  # or automation reload, sensors already "on" won't trigger — helper stays
  # stale. This compact sync corrects helpers that are out of step.
  - if:
      - "{{ trigger.id | default('manual') in ['ha_start', 'scheduled'] }}"
    then:
      - variables:
          _sync_delay: "{{ (presence_activation_delay | float(2)) * 60 }}"
          _now: "{{ as_timestamp(now()) | float(0) }}"
      - repeat:
          for_each:
            - sensors: "{{ tv_master_presence_sensors | default([], true) | reject('in', ['', 'sensor.none', 'none']) | list }}"
              helper: "{{ tv_master_presence_helper | default('') | string }}"
            - sensors: "{{ tv_room2_presence_sensors | default([], true) | reject('in', ['', 'sensor.none', 'none']) | list }}"
              helper: "{{ tv_room2_presence_helper | default('') | string }}"
            - sensors: "{{ tv_room3_presence_sensors | default([], true) | reject('in', ['', 'sensor.none', 'none']) | list }}"
              helper: "{{ tv_room3_presence_helper | default('') | string }}"
            - sensors: "{{ tv_room4_presence_sensors | default([], true) | reject('in', ['', 'sensor.none', 'none']) | list }}"
              helper: "{{ tv_room4_presence_helper | default('') | string }}"
            - sensors: "{{ tv_room5_presence_sensors | default([], true) | reject('in', ['', 'sensor.none', 'none']) | list }}"
              helper: "{{ tv_room5_presence_helper | default('') | string }}"
          sequence:
            - variables:
                _helper_id: "{{ repeat.item.helper | string }}"
                _helper_valid: "{{ _helper_id not in ['', 'sensor.none', 'none'] and (_helper_id | length) > 5 }}"
                _has_sensors: "{{ (repeat.item.sensors | length) > 0 }}"
            # --- Sync OFF → ON: helper is off but sensor(s) have been on long enough ---
            - if:
                - "{{ _helper_valid | bool(false) }}"
                - "{{ _has_sensors | bool(false) }}"
                - "{{ is_state(_helper_id, 'off') }}"
                - >
                  {% set ns = namespace(found=false) %}
                  {% for s in expand(repeat.item.sensors) %}
                    {% if s is not none and s.state == 'on' and ((_now | float) - (as_timestamp(s.last_changed, _now | float) | float)) >= (_sync_delay | float(120)) %}
                      {% set ns.found = true %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.found }}
              then:
                - action: input_boolean.turn_on
                  target:
                    entity_id: "{{ _helper_id }}"
                  continue_on_error: true
            # --- Sync ON → OFF: helper is on but all sensors are off (beyond deactivation delay) ---
            - if:
                - "{{ _helper_valid | bool(false) }}"
                - "{{ _has_sensors | bool(false) }}"
                - "{{ is_state(_helper_id, 'on') }}"
                - >
                  {% set _deact_delay = (presence_deactivation_delay | float(30)) * 60 %}
                  {% set all_off = namespace(result=true) %}
                  {% for s in expand(repeat.item.sensors) %}
                    {% if s is not none %}
                      {% if s.state != 'off' or ((_now | float) - (as_timestamp(s.last_changed, _now | float) | float)) < _deact_delay %}
                        {% set all_off.result = false %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}
                  {{ all_off.result }}
              then:
                - action: input_boolean.turn_off
                  target:
                    entity_id: "{{ _helper_id }}"
                  continue_on_error: true

  - variables:
      # ===== GROUP 1: INPUTS & HELPERS =====
      inputs:
        outdoor_temp_sensor: !input outdoor_temp_sensor
        eco_temp_input: !input eco_temp_input
        eco_temp_fixed: !input eco_temp_fixed
        away_temp_input: !input away_temp_input
        away_temp_fixed: !input away_temp_fixed
        away_mode_boolean: !input away_mode_boolean
        guest_mode_boolean: !input guest_mode_boolean
        pre_heat_timeout: !input pre_heat_timeout
        room_boost_activation_threshold: !input room_boost_activation_threshold
        min_trv_temp: !input min_trv_temp
        window_heat_delay: !input window_heat_delay
        window_close_settle_seconds: !input window_close_settle_seconds
        smart_drop_threshold: !input smart_drop_threshold
        hysteresis: !input hysteresis
        max_changes_per_hour: !input max_changes_per_hour
        master_hold_drop_after_raise_minutes: !input master_hold_drop_after_raise_minutes
        master_hold_raise_after_drop_minutes: !input master_hold_raise_after_drop_minutes
        enable_weather_compensation: !input enable_weather_compensation
        weather_compensation_sensor: !input weather_compensation_sensor
        weather_boost_zone1: !input weather_boost_zone1
        weather_boost_zone2: !input weather_boost_zone2
        weather_boost_zone3: !input weather_boost_zone3
        enable_humidity_compensation: !input enable_humidity_compensation
        humidity_drop_amount: !input humidity_drop_amount
        enable_leitstand_normal: !input enable_leitstand_normal
        enable_leitstand_expert: !input enable_leitstand_expert
        notify_devices: !input notify_devices
        quiet_schedule: !input quiet_schedule
        master_climate: !input master_climate
        master_write_log_helper: !input master_write_log_helper
        master_comfort_input: !input master_comfort_input
        master_comfort_fixed: !input master_comfort_fixed
        master_schedule: !input master_schedule
        master_presence_sensors: !input master_presence_sensors
        master_presence_helper: !input master_presence_helper
        master_pre_heat_helper: !input master_pre_heat_helper
        enable_master_presence_priority: !input enable_master_presence_priority
        master_presence_priority_helper: !input master_presence_priority_helper
        enable_room_boost: !input enable_room_boost
        room_boost_amount: !input room_boost_amount
        master_temp_sensor: !input master_temp_sensor
        master_humidity_sensor: !input master_humidity_sensor
        master_window: !input master_window
        room2_enabled: !input room2_enabled
        room2_climate: !input room2_climate
        room2_comfort_input: !input room2_comfort_input
        room2_comfort_fixed: !input room2_comfort_fixed
        room2_schedule: !input room2_schedule
        room2_presence_sensors: !input room2_presence_sensors
        room2_presence_helper: !input room2_presence_helper
        room2_pre_heat_helper: !input room2_pre_heat_helper
        room2_window: !input room2_window
        room2_temp_sensor: !input room2_temp_sensor
        room3_enabled: !input room3_enabled
        room3_climate: !input room3_climate
        room3_comfort_input: !input room3_comfort_input
        room3_comfort_fixed: !input room3_comfort_fixed
        room3_schedule: !input room3_schedule
        room3_presence_sensors: !input room3_presence_sensors
        room3_presence_helper: !input room3_presence_helper
        room3_pre_heat_helper: !input room3_pre_heat_helper
        room3_window: !input room3_window
        room3_temp_sensor: !input room3_temp_sensor
        room4_enabled: !input room4_enabled
        room4_climate: !input room4_climate
        room4_comfort_input: !input room4_comfort_input
        room4_comfort_fixed: !input room4_comfort_fixed
        room4_schedule: !input room4_schedule
        room4_presence_sensors: !input room4_presence_sensors
        room4_presence_helper: !input room4_presence_helper
        room4_pre_heat_helper: !input room4_pre_heat_helper
        room4_window: !input room4_window
        room4_temp_sensor: !input room4_temp_sensor
        room5_enabled: !input room5_enabled
        room5_climate: !input room5_climate
        room5_comfort_input: !input room5_comfort_input
        room5_comfort_fixed: !input room5_comfort_fixed
        room5_schedule: !input room5_schedule
        room5_presence_sensors: !input room5_presence_sensors
        room5_presence_helper: !input room5_presence_helper
        room5_pre_heat_helper: !input room5_pre_heat_helper
        room5_window: !input room5_window
        room5_temp_sensor: !input room5_temp_sensor
        follower1_enabled: !input follower1_enabled
        follower1_climate: !input follower1_climate
        follower1_offset: !input follower1_offset
        follower1_window: !input follower1_window
        follower2_enabled: !input follower2_enabled
        follower2_climate: !input follower2_climate
        follower2_offset: !input follower2_offset
        follower2_window: !input follower2_window
        summer_mode_boolean: !input summer_mode_boolean
        summer_heat_off_enabled: !input summer_heat_off_enabled
        summer_off_preset: !input summer_off_preset
        therme_lockout_enabled: !input therme_lockout_enabled
        therme_lockout_ac: !input therme_lockout_ac
        therme_off_preset: !input therme_off_preset
      rooms_model:
        - key: room2
          role: isolated
          enabled: !input room2_enabled
          climate: !input room2_climate
          window: !input room2_window
          temp_sensor: !input room2_temp_sensor
          schedule: !input room2_schedule
          presence_helper: !input room2_presence_helper
          presence_sensors: !input room2_presence_sensors
          pre_heat_helper: !input room2_pre_heat_helper
          comfort_input: !input room2_comfort_input
          comfort_fixed: !input room2_comfort_fixed
        - key: room3
          role: isolated
          enabled: !input room3_enabled
          climate: !input room3_climate
          window: !input room3_window
          temp_sensor: !input room3_temp_sensor
          schedule: !input room3_schedule
          presence_helper: !input room3_presence_helper
          presence_sensors: !input room3_presence_sensors
          pre_heat_helper: !input room3_pre_heat_helper
          comfort_input: !input room3_comfort_input
          comfort_fixed: !input room3_comfort_fixed
        - key: room4
          role: isolated
          enabled: !input room4_enabled
          climate: !input room4_climate
          window: !input room4_window
          temp_sensor: !input room4_temp_sensor
          schedule: !input room4_schedule
          presence_helper: !input room4_presence_helper
          presence_sensors: !input room4_presence_sensors
          pre_heat_helper: !input room4_pre_heat_helper
          comfort_input: !input room4_comfort_input
          comfort_fixed: !input room4_comfort_fixed
        - key: room5
          role: isolated
          enabled: !input room5_enabled
          climate: !input room5_climate
          window: !input room5_window
          temp_sensor: !input room5_temp_sensor
          schedule: !input room5_schedule
          presence_helper: !input room5_presence_helper
          presence_sensors: !input room5_presence_sensors
          pre_heat_helper: !input room5_pre_heat_helper
          comfort_input: !input room5_comfort_input
          comfort_fixed: !input room5_comfort_fixed
        - key: follower1
          role: follower
          enabled: !input follower1_enabled
          climate: !input follower1_climate
          window: !input follower1_window
          temp_sensor: ""
          offset: !input follower1_offset
        - key: follower2
          role: follower
          enabled: !input follower2_enabled
          climate: !input follower2_climate
          window: !input follower2_window
          temp_sensor: ""
          offset: !input follower2_offset
      helper_input_settle_seconds: !input helper_input_settle_seconds
      trigger_id_safe: "{{ trigger.id if trigger is defined and trigger is not none and trigger.id is defined else '' }}"
      helper_input_trigger_entity: >
        {% if trigger is defined and trigger is not none and trigger.event is defined and trigger.event.data is defined and trigger.event.data.entity_id is defined and trigger.event.data.entity_id is not none %}
          {% set raw_id = trigger.event.data.entity_id %}
        {% elif trigger is defined and trigger is not none and trigger.entity_id is defined and trigger.entity_id is not none %}
          {% set raw_id = trigger.entity_id %}
        {% else %}
          {% set raw_id = none %}
        {% endif %}
        {% if raw_id is none %}
          {{ '' }}
        {% elif raw_id is string %}
          {{ raw_id | string | trim }}
        {% elif raw_id is iterable %}
          {% set first_id = (raw_id | list | first) %}
          {{ first_id | string | trim if first_id is not none else '' }}
        {% else %}
          {{ raw_id | string | trim }}
        {% endif %}
      helper_input_trigger: >
        {{
          (
            (trigger_id_safe in [
              'eco_temp_input_change',
              'away_temp_input_change',
              'master_comfort_input_change',
              'room2_comfort_input_change',
              'room3_comfort_input_change',
              'room4_comfort_input_change',
              'room5_comfort_input_change'
            ])
            and
            (helper_input_trigger_entity | string not in ['', 'sensor.none', 'none'])
          )
          or
          (trigger_id_safe in ['away_mode_on', 'away_mode_off'])
        }}
      helper_input_debounce_required: >
        {{
          (helper_input_trigger | bool(false))
          and
          (helper_input_trigger_entity | string not in ['', 'sensor.none', 'none'])
          and
          (trigger_id_safe not in ['away_mode_on', 'away_mode_off'])
        }}
      helper_input_trigger_ts: >
        {% if not helper_input_trigger | bool(false) %}
          {{ as_timestamp(now()) }}
        {% elif trigger is defined and trigger is not none and trigger.event is defined and trigger.event.time_fired is defined %}
          {{ as_timestamp(trigger.event.time_fired, as_timestamp(now())) }}
