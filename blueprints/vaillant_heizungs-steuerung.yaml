              domain: schedule
        room5_presence_sensors:
          name: "👀 Präsenz"
          description: |

            Optionale Präsenzsensoren für Komfortfreigabe in Raum 5.

          default: []
          selector:
            entity:
              domain: binary_sensor
              device_class: occupancy
              multiple: true
        room5_presence_helper:
          name: "Room5 Presence Helper Entity"
          description: |

            Input boolean for room5 presence state. Create manually: Settings -> Helpers -> Toggle -> Name: 'Heating: Room5 Presence Active'

          default: ""
          selector:
            entity:
              domain: input_boolean
        room5_pre_heat_helper:
          name: "🔥 Pre-Heat Helper (opt)"
          description: |

            Optionaler Toggle zum Vorheizen auf Comfort, auch bei inaktivem Zeitplan/Präsenz.
            Auto-OFF bei: Präsenz ON, Zeitplan aktiv, oder Timeout.

          default: ""
          selector:
            entity:
              domain: input_boolean
        room5_window:
          name: "🪟 Fenster"
          description: |

            Fensterkontakt in Raum 5 für Sicherheitsabsenkung.

          default: ""
          selector:
            entity:
              domain: binary_sensor
              device_class: window
        room5_temp_sensor:
          name: "🌡️ Temperatursensor"
          description: |

            Optionaler externer Temperatursensor für Raum 5.

          default: ""
          selector:
            entity:
              domain: sensor
              device_class: temperature


    section_smart_functions:
      name: "🧠 Smarte Funktionen"
      description: |
        Optionale Zusatzmodule für Gebäude-Kompensation und Komfort.
        Alle Funktionen hier sind optional und additiv zur Basisregelung.
      collapsed: true
      input:
        enable_weather_compensation:
          name: "🌦️ Gebäude-Kompensation aktiv"
          description: |
            Aktiviert den dynamischen Aufschlag auf den Master-Sollwert an sehr kalten oder windigen Tagen.
          default: false
          selector:
            boolean:
        weather_compensation_sensor:
          name: "🌦️ Kompensations-Sensor (Plan A: Template)"
          description: |
            Plan A (empfohlen): Nutze einen Sensor, der direkt den Aufschlag auf den Master-Sollwert in °C liefert.
            Plan B (Fallback): Wenn leer oder ungültig, wird der Basis-Außensensor genutzt und über Zone 1-3 geregelt.
            Plan B quantisiert den Außentemperatur-Pfad auf 0,5°C Schritte, um Jitter zu reduzieren.
          default: ""
          selector:
            entity:
              domain: sensor
        outdoor_temp_sensor:
          name: "☀️ Außentemperatur (Basis-Sensor, opt)"
          description: |
            Basis-Außensensor für Plan-B-Fallback der Gebäude-Kompensation.
          default: ""
          selector:
            entity:
              domain: sensor
        weather_boost_zone1:
          name: "❄️ Kompensation Zone 1 (unter -10°C)"
          description: |
            Aufschlag auf den Master-Sollwert bei extremer Kälte (<= -10°C).
          default: 0.0
          selector:
            number:
              min: 0.0
              max: 5.0
              step: 0.5
              unit_of_measurement: "°C"
        weather_boost_zone2:
          name: "🥶 Kompensation Zone 2 (-10°C bis 0°C)"
          description: |
            Aufschlag auf den Master-Sollwert bei Frost (<= 0°C).
          default: 0.0
          selector:
            number:
              min: 0.0
              max: 5.0
              step: 0.5
              unit_of_measurement: "°C"
        weather_boost_zone3:
          name: "🧥 Kompensation Zone 3 (0°C bis +10°C)"
          description: |
            Aufschlag auf den Master-Sollwert an kühlen Tagen (<= +10°C). Über 10°C ist der Aufschlag 0°C (Zone 4).
          default: 0.0
          selector:
            number:
              min: 0.0
              max: 5.0
              step: 0.5
              unit_of_measurement: "°C"
        enable_room_boost:
          name: "🚀 Boost aktiv"
          description: |
            Erlaubt es Räumen, temporär über ihr normales Ziel hinauszuschießen, um schneller warm zu werden.
          default: true
          selector:
            boolean:
        room_boost_activation_threshold:
          name: "🚀 Boost-Aktivierung ab Differenz (°C)"
          description: |
            Wie viel Grad muss die Raumtemperatur UNTER dem Ziel liegen, damit Boost greift?
          default: 1.0
          selector:
            number:
              min: 0.5
              max: 3.0
              step: 0.5
              unit_of_measurement: "°C"
        room_boost_amount:
          name: "🚀 Boost Höhe (°C)"
          description: |
            Wie viel Grad extra feuert die Heizung im Boost-Modus?
          default: 2.0
          selector:
            number:
              min: 0.5
              max: 3.0
              step: 0.5
              unit_of_measurement: "°C"
        enable_humidity_compensation:
          name: "🔘 Feuchte-Kompensation aktiv"
          description: |
            Reduziert die Heizleistung, wenn die Luftfeuchtigkeit im Master-Raum > 60% liegt.
          default: false
          selector:
            boolean:
        humidity_drop_amount:
          name: "🔘 Feuchte-Kompensation Absenkung (°C)"
          description: |
            Um wie viel Grad soll das Target bei hoher Feuchtigkeit gedrosselt werden?
          default: 0.5
          selector:
            number:
              min: 0.5
              max: 2.0
              step: 0.5
              unit_of_measurement: "°C"

    section_season:
      name: "❄️ Sommermodus (Saison-Erkennung)"
      description: |
        Stabiler Saison-Schalter auf Basis eines gleitenden 72-h-Mittels der
        Außentemperatur mit fester Hysterese (Heizgrenze ±1,5 °C) — kein
        tägliches Pendeln, keine Monats-Grenzen nötig. Bei aktivem Sommermodus
        werden Pre-Heat, Boost und Gebäude-Kompensation ausgesetzt
        (Frostschutz bleibt). Optional wird zusätzlich die Heizung der Therme
        abgeschaltet (HVAC 'Off', Warmwasser läuft weiter) und alle TRVs gehen
        auf das TRV-Minimum — siehe "Sommer: Heizung aus (WW bleibt)".
        Der gesetzte input_boolean wird auch von Lüftungs-Steuerung und
        Geofencing mitgelesen.
      collapsed: true
      input:
        summer_mode_boolean:
          name: "🎚️ Sommermodus-Schalter (input_boolean)"
          description: |
            Gemeinsamer Saison-Schalter. Dieses Blueprint setzt ihn automatisch
            (wenn unten ein Mittelwert-Sensor gewählt ist) und liest ihn fürs
            Gating. Lüftung & Geofencing lesen denselben Helfer.
            Leer = Sommermodus deaktiviert.
            Anlegen: Einstellungen → Helfer → Umschalter (Toggle).
          default: ""
          selector:
            entity:
              domain: input_boolean
        summer_outdoor_mean_sensor:
          name: "🌡️ Außen-Mittelwert-Sensor (Statistics-Helfer)"
          description: |
            Gleitender 72-h-Mittelwert der Außentemperatur. Anlegen:
            Einstellungen → Helfer → Statistik → Quelle = Außensensor,
            Merkmal "Mittelwert (linear)", Max. Alter 72 h.
            ⚠️ Keinen Roh-Außensensor wählen — der schwankt Tag/Nacht um die
            Heizgrenze und der Sommermodus schaltet dann nie sauber.
            Leer = keine Automatik, Schalter nur manuell.
          default: ""
          selector:
            entity:
              domain: sensor
        summer_heating_limit:
          name: "🌡️ Heizgrenze (°C)"
          description: |
            Außen-Mittel, ab dem nicht mehr geheizt werden muss.
            Sommer EIN bei ≥ Heizgrenze + 1,5 °C, AUS bei < Heizgrenze − 1,5 °C.
            Richtwerte: Altbau 15, gedämmt 12, Passivhaus 10.
          default: 15
          selector:
            number:
              min: 8
              max: 20
              step: 0.5
              unit_of_measurement: "°C"
        summer_heat_off_enabled:
          name: "🛑 Sommer: Heizung aus (WW bleibt)"
          description: |
            AN (Default): Im Sommermodus wird die Heizung der Therme abgeschaltet
            (HVAC 'Off') — das Warmwasser läuft normal weiter — und alle TRVs
            werden auf das TRV-Minimum gesetzt (keine Eco/Komfort-Regelung,
            kein Pendeln). Frostschutz bleibt über den Zonen-Aus-Modus der
            Vaillant bzw. das TRV-Minimum erhalten.
            AUS: Sommermodus senkt wie bisher nur auf Eco/Frost ab, ohne die
            Therme aktiv abzuschalten.
            ⚠️ Prüfe einmal per Vaillant-App, ob HVAC 'Off' bei dir wirklich nur
            die Heizung stoppt und das Warmwasser weiterläuft.
            Hinweis: Außerhalb des Sommermodus schaltet der Leitstand einen auf
            'Off' stehenden Master automatisch wieder ein (selbstheilend). Zum
            bewussten Abschalten den Sommermodus-Schalter oder Away nutzen.
          default: true
          selector:
            boolean:
        summer_off_preset:
          name: "⚙️ Sommer-Aus über Preset (opt)"
          description: |
            Leer (Default): Abschaltung per climate.turn_off (HVAC 'Off') — nur
            Heizung aus, Warmwasser bleibt. Falls deine Anlage dafür stattdessen
            einen bestimmten Preset braucht, hier eintragen → dann wird
            climate.set_preset_mode genutzt.
            NICHT "system_off" verwenden — das beendet auch die
            Warmwasser-Bereitung.
          default: ""
          selector:
            text:

    section_therme_lockout:
      name: "🔌 Therme-Klima-Verriegelung (opt)"
      description: |
        Schaltet die Therme (= Master-Thermostat) ab, solange das mobile
        Klimagerät läuft. Nur relevant für raumluftABHÄNGIGE Geräte, die ihre
        Verbrennungsluft aus dem Raum ziehen — dort kann der Unterdruck der
        Klima Abgase (CO) in den Raum zurückziehen. RaumluftUNABHÄNGIGE
        Brennwertgeräte (eigene Zu-/Abluftführung) dürfen parallel zur Klima
        laufen → Feature AUS lassen.
        ⚠️ Softwareseitig lässt sich die Anlage nicht wirklich ausschalten —
        auch Presets beenden nur die Heiz-/WW-Programme (Frostschutz bleibt).
        Ein echtes Aus geht nur am Gerät selbst. KEIN Ersatz für einen
        CO-Melder!
        Während der Sperre schreibt der Leitstand nichts (kein Gegen-Steuern);
        sobald die Klima aus ist, läuft der Leitstand normal weiter und stellt
        den Zustand wieder her.
      collapsed: true
      input:
        therme_lockout_enabled:
          name: "🔘 Therme-Klima-Verriegelung aktiv"
          description: |
            AN: Wenn die Klima läuft, wird die Therme (Master-Thermostat)
            abgeschaltet. Klima aus → Therme wieder ein.
          default: false
          selector:
            boolean:
        therme_lockout_ac:
          name: "❄️ Klima-Entity (climate)"
          description: |
            Das mobile Klimagerät. "läuft" = Status ≠ off. Dieselbe Entity wie
            in der Lüftungs-Steuerung.
          default: ""
          selector:
            entity:
              domain: climate
        therme_off_preset:
          name: "⚙️ Aus über Preset (opt)"
          description: |
            Leer (Default): Therme wird per climate.turn_off (HVAC 'Off')
            abgeschaltet. Optional: Preset eintragen (z. B. "system_off") →
            dann wird stattdessen climate.set_preset_mode genutzt.
            Hinweis: Softwareseitig lässt sich die Anlage in keinem Fall
            komplett ausschalten — auch "system_off" beendet nur die
            Heiz-/WW-Programme (Frostschutz bleibt). Ein echtes Aus geht nur
            am Gerät selbst.
          default: ""
          selector:
            text:

    section_debug:
      name: "🛠️ System & Debugging"
      description: |
        Leitstand und Administrator-Tools.
        ⚠️ Kritische Alerts (Master offline, NOT-AUS, TRV offline, API-Budget erschöpft) werden **immer** automatisch als Notification gefeuert und löschen sich selbst, sobald das Problem behoben ist.
      collapsed: true
      input:
        quiet_schedule:
          name: "🌙 Ruhezeit-Zeitplan"
          description: |
            Optionaler Zeitplan (schedule-Helfer) für Ruhezeiten.
            Wenn aktiv (on), werden alle Benachrichtigungen unterdrückt.
            Leer lassen = keine Ruhezeit-Blockierung.
          default: ""
          selector:
            entity:
              domain: schedule
        enable_leitstand_normal:
          name: "📣 Leitstand Normal"
          description: |
            Kompakte Übersicht als Push-Notification.
            Feuert nur bei Events/Writes (nicht bei Routine-Läufen).
            Überschreibt sich selbst (Dashboard).
          default: false
          selector:
            boolean:
        enable_leitstand_expert:
          name: "📣 Leitstand Expert (Verlauf)"
          description: |
            Volle Diagnose-Details bei jedem Lauf (alle 3 Min).
            Jede Notification bleibt erhalten (History).
          default: false
          selector:
            boolean:
        notify_devices:
          name: "📱 Mobile Push (opt)"
          description: |
            Mobile-App Gerät(e) für Push-Notifications aufs Handy.
            Wird für **Normal-Leitstand** und **Kritische Alerts** genutzt.
            Expert-Verlauf wird NICHT aufs Handy gepusht (zu häufig).
          default: []
          selector:
            device:
              filter:
                integration: mobile_app
              multiple: true

