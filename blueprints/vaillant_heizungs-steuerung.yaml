          description: |

            Optionaler Zeitplan für den Komfortbetrieb im Master-Raum.

          default: ""
          selector:
            entity:
              domain: schedule
        enable_master_presence_priority:
          name: "👑 Master gewinnt bei Präsenz"
          description: |

            Aktiviert Vorrang des Master-Raums gegenüber isolierten Räumen bei Präsenz.

          default: false
          selector:
            boolean:
        master_presence_priority_helper:
          name: "🧩 Master-Priorität Helper (opt)"
          description: |

            Optionaler Laufzeit-Override für Master-Priorität. ON = Vorrang aktiv.
            Erforderlicher Helfer-Typ: **Umschalter** (input_boolean).

          default: ""
          selector:
            entity:
              domain: input_boolean
        master_presence_sensors:
          name: "👀 Master Präsenz"
          description: |

            Optionale Präsenzsensoren für bedarfsgeführten Komfortbetrieb im Master-Raum.

          default: []
          selector:
            entity:
              domain: binary_sensor
              device_class: occupancy
              multiple: true
        master_presence_helper:
          name: "Master Presence Helper Entity"
          description: |

            Input boolean to store master presence state. Create manually: Settings -> Helpers -> Toggle -> Name: 'Heating: Master Presence Active'

          default: ""
          selector:
            entity:
              domain: input_boolean
        master_pre_heat_helper:
          name: "🔥 Master Pre-Heat Helper (opt)"
          description: |

            Optionaler Toggle zum Vorheizen des Master-Raums auf Comfort-Temperatur,
            auch wenn Zeitplan/Präsenz gerade inaktiv sind.
            Wird automatisch deaktiviert bei: Präsenz ON, Zeitplan aktiv, oder Timeout.
            Erforderlicher Helfer-Typ: **Umschalter** (input_boolean).

          default: ""
          selector:
            entity:
              domain: input_boolean
        master_temp_sensor:
          name: "🌡️ Master Temperatursensor"
          description: |

            Optionaler externer Temperatursensor des Master-Raums.

          default: ""
          selector:
            entity:
              domain: sensor
              device_class: temperature
        master_humidity_sensor:
          name: "💧 Master Feuchte"
          description: |

            Optionaler Luftfeuchtesensor für Feuchtekompensation im Master-Raum.

          default: ""
          selector:
            entity:
              domain: sensor
              device_class: humidity
        master_window:
          name: "🪟 Master Fenster (opt)"
          description: |

            Optionaler Fensterkontakt im Master-Raum.
            Fenster offen > Verzögerung → Master auf TRV-Minimum.

          default: ""
          selector:
            entity:
              domain: binary_sensor
              device_class: window
        master_write_log_helper:
          name: "📝 Master Write Log"
          description: |
            **Pflicht-Helper für API-Budget und Anti-Cycling.**

            **Typ:** `input_text` (max 255 Zeichen).

            Speichert Write-Richtung und Timestamps im Format: `kind:ts1,ts2,...`
            Ermöglicht Sliding-Window Budget-Tracking (N Writes pro 60min).

            ⚠️ **NICHT manuell ändern!** Wird automatisch vom Blueprint verwaltet.

            **Erstellen:** Einstellungen → Helfer → Text → Name: "Vaillant Master Write Log" → Max: 255
          selector:
            entity:
              domain: input_text

